<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>침묵의 설백호(雪白湖)</title>
<style>
  html{-webkit-text-size-adjust:none;text-size-adjust:none;}
  html,body{margin:0;padding:0;height:100%;background:#05070c;overflow:hidden;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;}
  #stage{position:relative;width:100%;height:100vh;display:flex;align-items:flex-end;justify-content:center;background:#000;}
  #bg{position:absolute;top:20%;left:20%;width:60%;height:60%;background:#05070c;background-size:cover;background-position:center;
      transition:opacity .8s;filter:contrast(1.05);}
  #bg::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.35);transition:background .3s;}
  #bg.blackout::after{background:rgba(0,0,0,.8);}
  #bg.lounge{background-image:url('night-interior-low-resolution.png');}
  #bg.room{background-image:url('dark-bedroom-photorealistic.png');}
  #bg.lake{background-image:url('night-frozen-lake.png');}
  #bg.kitchen{background-image:url('rustic-mountain-scene.png');}
  #bg.dhroom{background-image:url('caretaker-room.png');}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;}
  #bloodOverlay{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:15;overflow:hidden;}
  #bloodOverlay.show{opacity:1;}
  #bloodOverlay .drip{position:absolute;top:-10%;width:6%;height:0%;background:linear-gradient(180deg,#8a0000,#3d0000);
       border-radius:0 0 50% 50%;filter:blur(1px);}
  #bloodOverlay.show .drip{animation:dripDown 1.6s ease-in forwards;}
  @keyframes dripDown{0%{height:0%;opacity:.95;}70%{opacity:.9;}100%{height:130%;opacity:.85;}}
  #bloodFlash{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%, rgba(120,0,0,.55), rgba(40,0,0,.15) 60%, transparent 80%);
       opacity:0;pointer-events:none;z-index:16;}
  #bloodFlash.show{animation:bloodFlashPulse .5s ease-out forwards;}
  @keyframes bloodFlashPulse{0%{opacity:0;}15%{opacity:1;}100%{opacity:0;}}
  #silhouettes{position:absolute;bottom:0;left:0;width:100%;height:85vh;display:flex;justify-content:center;align-items:flex-end;gap:4vw;pointer-events:none;z-index:6;padding:0 4vw;box-sizing:border-box;}
  #silhouettes.count-1{justify-content:center;}
  #silhouettes.count-2{justify-content:center;gap:18vw;}
  #silhouettes.count-3{justify-content:space-between;gap:6vw;}
  .sil{width:28vw;max-width:380px;height:78vh;position:relative;opacity:0;transition:opacity .6s, transform .3s;
       background-size:contain;background-repeat:no-repeat;background-position:center bottom;
       filter:drop-shadow(0 0 18px rgba(58,122,191,.65));}
  .sil.show{opacity:.82;}
  #silhouettes.count-1 .sil{width:32vw;max-width:420px;height:82vh;}
  #silhouettes.count-2 .sil{width:26vw;max-width:340px;height:76vh;}
  #silhouettes.count-3 .sil{width:22vw;max-width:280px;height:72vh;}

  /* Pose variants via transform */
  .sil.pose-alert{transform:scale(1.05) translateY(-2%);}
  .sil.pose-cower{transform:scale(.9) translateY(4%);opacity:.7;}
  .sil.pose-weapon{filter:drop-shadow(0 0 22px rgba(90,160,255,.9));}
  .sil.pose-defensive{transform:scale(.95);}
  .sil.pose-collapsed{transform:rotate(85deg) scale(.8) translateY(30%);opacity:.65;}
  .sil.pose-bound{transform:scale(.92) translateY(5%);}
  #textbox{position:absolute;bottom:0;left:0;width:100%;min-height:26vh;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.92) 20%);
            box-sizing:border-box;padding:24px 8vw 30px;color:#eee;font-size:1.15rem;line-height:1.8;cursor:pointer;z-index:7;}
  #speaker{color:#7fd0ff;font-weight:bold;margin-bottom:6px;display:block;min-height:1.2em;}
  #choices{position:absolute;bottom:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.55);display:none;
            flex-direction:column;align-items:center;justify-content:center;gap:16px;backdrop-filter:blur(1px);z-index:10;}
  #choices.show{display:flex;}
  .choiceBtn{background:rgba(15,25,45,.82);border:1px solid #4a7ab0;color:#dff;padding:16px 40px;font-size:1.05rem;
             border-radius:6px;cursor:pointer;width:min(70vw,520px);transition:.2s;box-shadow:0 2px 10px rgba(0,0,0,.5);}
  .choiceBtn:hover{background:rgba(60,110,170,.85);}
  #cont{position:absolute;right:20px;bottom:18px;color:#fff;font-size:.85rem;font-weight:bold;text-shadow:0 0 8px rgba(255,255,255,.8);
        animation:blinkCont 1s ease-in-out infinite;z-index:8;}
  @keyframes blinkCont{0%,100%{opacity:1;}50%{opacity:.25;}}
  #titleScreen{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;}
  #titleScreen h1{color:#8fd0ff;letter-spacing:.3em;font-size:1.8rem;margin-bottom:40px;text-shadow:0 0 20px #2a6fb0;}
  #startBtn{background:none;border:1px solid #8fd0ff;color:#8fd0ff;padding:14px 44px;font-size:1rem;cursor:pointer;letter-spacing:.2em;}
  #startBtn:hover{background:rgba(143,208,255,.15);}
  #endScreen{position:absolute;inset:0;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;text-align:center;padding:0 10vw;}
  #endScreen.show{display:flex;}
  #endScreen h2{color:#ffcf7f;font-size:1.6rem;margin-bottom:20px;letter-spacing:.15em;}
  #endScreen p{color:#ccc;line-height:1.8;font-size:1.05rem;}
  #retryBtn{margin-top:30px;background:none;border:1px solid #888;color:#ccc;padding:10px 30px;cursor:pointer;}

  /* volume control (applies to ALL background sound + all SFX via master gain) */
  #volPanel{position:absolute;top:14px;right:14px;z-index:30;background:rgba(10,15,25,.75);border:1px solid #345;
             border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:8px;color:#cde;font-size:.85rem;
             font-family:monospace;user-select:none;}
  #volPanel button{background:rgba(60,90,130,.5);border:1px solid #567;color:#dff;width:30px;height:30px;border-radius:6px;
                    cursor:pointer;font-size:1rem;line-height:1;}
  #volPanel button:hover{background:rgba(90,130,180,.7);}
  #volBarWrap{width:80px;height:8px;background:#223;border-radius:4px;overflow:hidden;}
  #volBar{height:100%;width:70%;background:linear-gradient(90deg,#3a7abf,#7fd0ff);transition:width .15s;}
  #volPct{width:34px;text-align:right;}

  @media (max-width:600px){
    #textbox{font-size:.95rem;min-height:30vh;padding:16px 5vw 22px;}
    .sil{width:42vw;height:65vh;max-width:none;}

  /* Dev mode */

<body>

<script>
/* ---------------- AUDIO (all routed through master gain -> volume control affects everything) ---------------- */
let actx=null, master=null, muted=false, volume=0.7, lastVolume=0.7;
let windNodes=null, droneNodes=null, windIndoor=0.06, windOutdoor=0.35;

function initAudio(){
  if(actx) return;
  actx=new (window.AudioContext||window.webkitAudioContext)();
  master=actx.createGain();
  master.gain.value=volume;
  master.connect(actx.destination);
  startWind();
  startDrone();
}
function noiseBuffer(){
  const b=actx.createBuffer(1, actx.sampleRate*2, actx.sampleRate);
  const d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  return b;
}
function startWind(){
  const src=actx.createBufferSource();
  src.buffer=noiseBuffer(); src.loop=true;
  const filt=actx.createBiquadFilter(); filt.type="lowpass"; filt.frequency.value=220;
  const g=actx.createGain(); g.gain.value=windIndoor;
  src.connect(filt); filt.connect(g); g.connect(master);
  src.start();
  windNodes={src,filt,g};
  // slow LFO on filter freq for blizzard gust effect
  const lfo=actx.createOscillator(); lfo.frequency.value=0.08;
  const lfoGain=actx.createGain(); lfoGain.gain.value=80;
  lfo.connect(lfoGain); lfoGain.connect(filt.frequency); lfo.start();
}
function setWindIntensity(outdoor){
  if(!actx || !windNodes) return;
  const now=actx.currentTime;
  const targetGain = outdoor ? windOutdoor : windIndoor;
  const targetFreq = outdoor ? 500 : 220;
  windNodes.g.gain.cancelScheduledValues(now);
  windNodes.g.gain.setValueAtTime(windNodes.g.gain.value, now);
  windNodes.g.gain.linearRampToValueAtTime(targetGain, now+1.0);
  windNodes.filt.frequency.cancelScheduledValues(now);
  windNodes.filt.frequency.setValueAtTime(windNodes.filt.frequency.value, now);
  windNodes.filt.frequency.linearRampToValueAtTime(targetFreq, now+1.0);
}
function sfxGust(){
  if(!actx) return;
  const now=actx.currentTime;
  const src=actx.createBufferSource(); src.buffer=noiseBuffer(); src.loop=false;
  const filt=actx.createBiquadFilter(); filt.type="lowpass"; filt.frequency.value=350;
  const g=actx.createGain(); g.gain.value=0.001;
  src.connect(filt); filt.connect(g); g.connect(master);
  g.gain.setValueAtTime(0.001, now);
  g.gain.linearRampToValueAtTime(0.6, now+0.4);
  g.gain.linearRampToValueAtTime(0.001, now+1.8);
  src.start(now); src.stop(now+1.8);
  // sharp whistle overlay
  const o=actx.createOscillator(); o.type="sine";
  const og=actx.createGain(); og.gain.value=0.001;
  o.connect(og); og.connect(master);
  o.frequency.setValueAtTime(900, now);
  o.frequency.linearRampToValueAtTime(1400, now+0.6);
  o.frequency.linearRampToValueAtTime(700, now+1.4);
  og.gain.setValueAtTime(0.001, now);
  og.gain.linearRampToValueAtTime(0.12, now+0.4);
  og.gain.linearRampToValueAtTime(0.001, now+1.6);
  o.start(now); o.stop(now+1.7);
}
function startDrone(){
  const o1=actx.createOscillator(); o1.type="sine"; o1.frequency.value=55;
  const o2=actx.createOscillator(); o2.type="sine"; o2.frequency.value=58;
  const g=actx.createGain(); g.gain.value=0.05;
  o1.connect(g); o2.connect(g); g.connect(master);
  o1.start(); o2.start();
  droneNodes={o1,o2,g};
}
function sfxType(){
  if(!actx) return;
  const now = actx.currentTime;
  // 1. High crisp key strike: clicky noise
  const src = actx.createBufferSource();
  src.buffer = noiseBuffer();
  src.loop = false;
  const filt = actx.createBiquadFilter();
  filt.type = "bandpass";
  filt.frequency.value = 2400 + (Math.random() * 600 - 300);
  filt.Q.value = 4;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.08, now);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.035);
  src.connect(filt);
  filt.connect(g);
  g.connect(master);
  src.start(now);
  src.stop(now + 0.036);

  // 2. Body thud: subtle typewriter chassis resonance
  const o = actx.createOscillator();
  o.type = "sine";
  o.frequency.setValueAtTime(320 + (Math.random() * 40 - 20), now);
  o.frequency.exponentialRampToValueAtTime(140, now + 0.04);
  const og = actx.createGain();
  og.gain.setValueAtTime(0.06, now);
  og.gain.exponentialRampToValueAtTime(0.0001, now + 0.04);
  o.connect(og);
  og.connect(master);
  o.start(now);
  o.stop(now + 0.042);
}
function sfxClick(){
  if(!actx) return;
  const o=actx.createOscillator(); o.type="square"; o.frequency.value=800;
  const g=actx.createGain(); g.gain.value=0.06;
  o.connect(g); g.connect(master);
  g.gain.setValueAtTime(0.06,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.05);
  o.start(); o.stop(actx.currentTime+0.06);
}
function sfxGlass(){
  if(!actx) return;
  const src=actx.createBufferSource(); src.buffer=noiseBuffer();
  const filt=actx.createBiquadFilter(); filt.type="highpass"; filt.frequency.value=2500;
  const g=actx.createGain(); g.gain.value=0.85;
  src.connect(filt); filt.connect(g); g.connect(master);
  g.gain.setValueAtTime(0.85,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.4);
  src.start(); src.stop(actx.currentTime+0.4);
}
function sfxScream(){
  if(!actx) return;
  const now=actx.currentTime;
  const o=actx.createOscillator(); o.type="sawtooth";
  const g=actx.createGain(); g.gain.value=0.001;
  const filt=actx.createBiquadFilter(); filt.type="bandpass"; filt.frequency.value=1200; filt.Q.value=6;
  o.connect(filt); filt.connect(g); g.connect(master);
  o.frequency.setValueAtTime(600, now);
  o.frequency.exponentialRampToValueAtTime(1500, now+0.5);
  o.frequency.exponentialRampToValueAtTime(2000, now+0.85);
  g.gain.setValueAtTime(0.001, now);
  g.gain.exponentialRampToValueAtTime(0.75, now+0.5);
  g.gain.exponentialRampToValueAtTime(0.9, now+0.85);
  g.gain.setValueAtTime(0.0001, now+0.86); // cut off abruptly at the peak, no fade-down
  o.start(now); o.stop(now+0.9);
  const src=actx.createBufferSource(); src.buffer=noiseBuffer();
  const nf=actx.createBiquadFilter(); nf.type="bandpass"; nf.frequency.value=2000; nf.Q.value=2;
  const ng=actx.createGain(); ng.gain.value=0.15;
  src.connect(nf); nf.connect(ng); ng.connect(master);
  ng.gain.setValueAtTime(0.001, now);
  ng.gain.linearRampToValueAtTime(0.25, now+0.85);
  ng.gain.setValueAtTime(0.0001, now+0.86);
  src.start(now); src.stop(now+0.9);
}
function sfxReveal(){
  if(!actx) return;
  const now=actx.currentTime;
  // two soft, muted taps — "타탁" — not sharp or startling
  [0, 0.12].forEach((t,i)=>{
    const o=actx.createOscillator(); o.type="sine"; o.frequency.value= i===0 ? 180 : 150;
    const g=actx.createGain(); g.gain.value=0.001;
    const filt=actx.createBiquadFilter(); filt.type="lowpass"; filt.frequency.value=900;
    o.connect(filt); filt.connect(g); g.connect(master);
    g.gain.setValueAtTime(0.001, now+t);
    g.gain.linearRampToValueAtTime(0.22, now+t+0.015);
    g.gain.exponentialRampToValueAtTime(0.001, now+t+0.13);
    o.start(now+t); o.stop(now+t+0.14);
  });
}
function sfxDoorOpen(){
  if(!actx) return;
  const now=actx.currentTime;
  // low wooden creak: slow pitch drift + filtered noise, sits quietly under the scene
  const src=actx.createBufferSource(); src.buffer=noiseBuffer(); src.loop=false;
  const filt=actx.createBiquadFilter(); filt.type="bandpass"; filt.frequency.value=220; filt.Q.value=3;
  const g=actx.createGain(); g.gain.value=0.001;
  src.connect(filt); filt.connect(g); g.connect(master);
  filt.frequency.setValueAtTime(180, now);
  filt.frequency.linearRampToValueAtTime(320, now+0.9);
  filt.frequency.linearRampToValueAtTime(150, now+1.6);
  g.gain.setValueAtTime(0.001, now);
  g.gain.linearRampToValueAtTime(0.18, now+0.3);
  g.gain.linearRampToValueAtTime(0.12, now+1.0);
  g.gain.exponentialRampToValueAtTime(0.001, now+1.7);
  src.start(now); src.stop(now+1.75);
  // deep wooden body resonance underneath
  const o=actx.createOscillator(); o.type="triangle"; o.frequency.value=70;
  const og=actx.createGain(); og.gain.value=0.001;
  o.connect(og); og.connect(master);
  og.gain.setValueAtTime(0.001, now);
  og.gain.linearRampToValueAtTime(0.1, now+0.25);
  og.gain.exponentialRampToValueAtTime(0.001, now+1.3);
  o.start(now); o.stop(now+1.35);
}
function sfxHeartbeat(){
  if(!actx) return;
  [0,0.35].forEach(t=>{
    const o=actx.createOscillator(); o.type="sine"; o.frequency.value=60;
    const g=actx.createGain(); g.gain.value=0.3;
    o.connect(g); g.connect(master);
    g.gain.setValueAtTime(0.3,actx.currentTime+t);
    g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+t+0.25);
    o.start(actx.currentTime+t); o.stop(actx.currentTime+t+0.3);
  });
}
function sfxThunder(){
  if(!actx) return;
  const src=actx.createBufferSource(); src.buffer=noiseBuffer();
  const filt=actx.createBiquadFilter(); filt.type="lowpass"; filt.frequency.value=200;
  const g=actx.createGain(); g.gain.value=0.95;
  src.connect(filt); filt.connect(g); g.connect(master);
  g.gain.setValueAtTime(0.95,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+1.2);
  src.start(); src.stop(actx.currentTime+1.2);
}
function sfxBluntHit(){
  if(!actx) return;
  const now=actx.currentTime;
  [0, 0.55].forEach((t,i)=>{
    const strength = i===0 ? 1 : 0.7;
    // low thud body
    const o=actx.createOscillator(); o.type="sine"; o.frequency.value=90;
    const g=actx.createGain(); g.gain.value=0.001;
    o.connect(g); g.connect(master);
    o.frequency.setValueAtTime(90, now+t);
    o.frequency.exponentialRampToValueAtTime(40, now+t+0.15);
    g.gain.setValueAtTime(0.001, now+t);
    g.gain.linearRampToValueAtTime(0.8*strength, now+t+0.012);
    g.gain.exponentialRampToValueAtTime(0.001, now+t+0.28);
    o.start(now+t); o.stop(now+t+0.3);
    // short noise crack for impact texture
    const src=actx.createBufferSource(); src.buffer=noiseBuffer();
    const filt=actx.createBiquadFilter(); filt.type="lowpass"; filt.frequency.value=700;
    const ng=actx.createGain(); ng.gain.value=0.001;
    src.connect(filt); filt.connect(ng); ng.connect(master);
    ng.gain.setValueAtTime(0.001, now+t);
    ng.gain.linearRampToValueAtTime(0.5*strength, now+t+0.008);
    ng.gain.exponentialRampToValueAtTime(0.001, now+t+0.15);
    src.start(now+t); src.stop(now+t+0.16);
  });
}
function sfxPowerOut(){
  if(!actx) return;
  const o=actx.createOscillator(); o.type="sine"; o.frequency.value=50;
  const g=actx.createGain(); g.gain.value=0.85;
  o.connect(g); g.connect(master);
  g.gain.setValueAtTime(0.85,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.5);
  o.start(); o.stop(actx.currentTime+0.5);
  const src=actx.createBufferSource(); src.buffer=noiseBuffer();
  const filt=actx.createBiquadFilter(); filt.type="bandpass"; filt.frequency.value=1800; filt.Q.value=4;
  const g2=actx.createGain(); g2.gain.value=0.4;
  src.connect(filt); filt.connect(g2); g2.connect(master);
  g2.gain.setValueAtTime(0.4,actx.currentTime);
  g2.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.25);
  src.start(); src.stop(actx.currentTime+0.25);
}
let tensionHeld=false, tensionTremolo=null;
function raiseTension(){
  if(!actx || !droneNodes) return;
  const now=actx.currentTime;
  const peak=0.26;
  tensionHeld=true;
  droneNodes.g.gain.cancelScheduledValues(now);
  droneNodes.g.gain.setValueAtTime(droneNodes.g.gain.value, now);
  droneNodes.g.gain.linearRampToValueAtTime(peak, now+0.3);
  if(tensionTremolo){ tensionTremolo.stop(); tensionTremolo=null; }
  const o=actx.createOscillator(); o.type="sine"; o.frequency.value=61.5;
  const og=actx.createGain(); og.gain.value=0;
  o.connect(og); og.connect(master);
  og.gain.setValueAtTime(0, now);
  og.gain.linearRampToValueAtTime(0.1, now+0.3);
  o.start(now);
  tensionTremolo={stop:()=>{ try{ og.gain.cancelScheduledValues(actx.currentTime); og.gain.linearRampToValueAtTime(0, actx.currentTime+1); o.stop(actx.currentTime+1.1); }catch(e){} }};
}
function releaseTension(){
  if(!actx || !droneNodes || !tensionHeld) return;
  const now=actx.currentTime;
  const base=0.05;
  tensionHeld=false;
  droneNodes.g.gain.cancelScheduledValues(now);
  droneNodes.g.gain.setValueAtTime(droneNodes.g.gain.value, now);
  droneNodes.g.gain.linearRampToValueAtTime(base, now+1.2);
  if(tensionTremolo){ tensionTremolo.stop(); tensionTremolo=null; }
}
const SFX={click:sfxClick, glass:sfxGlass, heartbeat:sfxHeartbeat, thunder:sfxThunder, bluntHit:sfxBluntHit, powerout:sfxPowerOut, scream:sfxScream, gust:sfxGust, reveal:sfxReveal, doorOpen:sfxDoorOpen, none:()=>{}};
const TENSION_SFX=new Set(["glass","thunder","bluntHit","heartbeat","scream"]);

function applyVolume(){
  document.getElementById("volPct").textContent=Math.round((muted?0:volume)*100)+"%";
  document.getElementById("volBar").style.width=(muted?0:volume*100)+"%";
  document.getElementById("muteBtn").textContent=muted?"🔇":"🔊";
  if(master) master.gain.value = muted?0:volume; // single master bus: covers wind, drone, and every SFX
}
document.getElementById("volUp").onclick=()=>{ initAudio(); volume=Math.min(1,+(volume+0.1).toFixed(2)); if(muted){muted=false;} applyVolume(); };
document.getElementById("volDown").onclick=()=>{ initAudio(); volume=Math.max(0,+(volume-0.1).toFixed(2)); applyVolume(); };
document.getElementById("muteBtn").onclick=()=>{
  initAudio();
  if(!muted){ lastVolume=volume; muted=true; }
  else { muted=false; volume=lastVolume; }
  applyVolume();
};
window.addEventListener("keydown",e=>{
  if(e.key==="m"||e.key==="M") document.getElementById("muteBtn").click();
  if(e.key==="[") document.getElementById("volDown").click();
  if(e.key==="]") document.getElementById("volUp").click();
});
applyVolume();

/* ---------------- SCENARIO ---------------- */
const CHAR={
  sangjun:{name:"나", gender:"male"}, suhyun:{name:"수현", gender:"female"},
  donghyun:{name:"동현", gender:"male"}, yura:{name:"유라", gender:"female"}, narr:{name:""}
};

const scenes={
  // ---- 프롤로그: 도착 & 인물 소개 ----
  s1:{bg:"lounge",sil:[],speaker:"narr",
    text:"폭설이 그칠 줄 모르고 쏟아지던 밤. 산길이 끊긴 끝에 만난 산장 '백설장'. 나와 일행은 하나둘 거실로 모여든다.",
    sfx:"none", next:"s1b"},
  s1b:{bg:"lounge",sil:["suhyun"],speaker:"narr",
    text:"수현은 나의 회사 입사 동기다. 입사 첫날부터 카메라를 들고 다니던, 늘 먼저 말을 걸어오는 성격.",
    sfx:"none", next:"s2"},
  s2:{bg:"lounge",sil:["suhyun"],speaker:"suhyun",
    text:"\"와,진짜 이러다 며칠은 못 나가는 거 아니에요 상준씨?\" 수현이 젖은 카메라 가방을 내려놓으며 웃는다. 손가락에 낀 낡은 은반지가 눈에 잠깐 스친다. 이런 상황에서도 재미있어하는 눈치다.",
    sfx:"none", next:"choice_greet"},

  choice_greet:{type:"choice", bg:"lounge", sil:["suhyun"], speaker:"narr",
    text:"수현에게 어떻게 대답할까?",
    options:[

  s2b_warm:{bg:"lounge",sil:["suhyun"],speaker:"sangjun",
    text:"\"그러게, 일단 몸이나 녹이자.\" 상준이 젖은 옷깃을 털어내며 벽난로 쪽으로 다가선다.",
    sfx:"none", next:"s3intro"},
  s2b_fun:{bg:"lounge",sil:["suhyun"],speaker:"sangjun",
    text:"\"오히려 재밌겠는데?\" 내말에 수현이 소리 내어 웃는다. \"그렇게 말할 줄 알았어요.\"",
    sfx:"none", next:"s3intro"},

  s3intro:{bg:"lounge",sil:["donghyun"],speaker:"narr",
    text:"현관 쪽에서 한 남자가 들어온다. 처음 보는 얼굴이다. 이 산장 관리인인가 — 체격이 다부지고, 말수가 적어 보인다.",
    sfx:"none", next:"s3"},
  s3:{bg:"lounge",sil:["donghyun"],speaker:"donghyun",
    text:"\"이 산장 관리인 최동현입니다. 이 정도 눈이면… 오늘은 다들 여기서 묵으셔야 할 겁니다.\" 동현이 무뚝뚝하게 인사를 건넨다. 짧은 한마디였지만, 손은 이미 능숙하게 벽난로 장작을 정리하고 있다.",
    sfx:"none", next:"s3b"},
  s3b:{bg:"lounge",sil:["donghyun"],speaker:"sangjun",
    text:"\"안녕하세요, 한상준입니다. 신세 좀 지겠습니다.\" 상준이 먼저 손을 내밀며 인사를 건넨다.",
    sfx:"none", next:"s4intro"},
  s4intro:{bg:"lounge",sil:["yura"],speaker:"narr",
    text:"조금 늦게, 또 한 사람이 들어온다. 이쪽도 초면이다. 누구와도 시선을 오래 마주치지 않는 여자다.",
    sfx:"none", next:"s4"},
  s4:{bg:"lounge",sil:["yura"],speaker:"yura",
    text:"\"…안녕하세요. 이유라라고 합니다. 혼자 여행 중이었는데, 오늘은 여기서 묵으려고요.\" 짧은 자기소개 후, 다시 말이 없어진다.",
    sfx:"none", next:"s5"},
  s5:{bg:"lounge",sil:["yura"],speaker:"yura",
    text:"\"저는 먼저 좀 쉴게요. 두통이 있어서.\" 유라는 그렇게 말하고 2층으로 올라간다. 곧 방문 닫히는 소리가 들린다.",
    sfx:"none", next:"s5b"},
  s5b:{bg:"lounge",sil:["suhyun"],speaker:"suhyun",
    text:"\"저도 화장실 좀 다녀올게요.\" 수현이 자리에서 일어나 잠시 자리를 비운다.",
    sfx:"none", next:"s6"},
  s6:{bg:"lounge",sil:[],speaker:"narr",
    text:"얼마 지나지 않아 수현이 돌아와 다시 자리에 앉는다. 세 사람만 남은 거실. 창밖 눈보라 소리와 벽난로 장작 타는 소리만 나직이 흐른다.",

  // ---- 유라, 잠깐 다시 내려와 잡담 ----
  s6_yura_return:{bg:"lounge",sil:["yura"],speaker:"narr",

  choice_smalltalk1:{type:"choice", bg:"lounge", sil:["yura"], speaker:"narr",

    options:[

      {label:"\"이 산장, 뭔가 무섭게 생기지 않았어요?\" (농담)", next:"talk1_joke"}
    ]},
  talk1_health:{bg:"lounge",sil:["yura"],speaker:"yura",
    text:"\"조금요. 원래 예민해서… 낯선 곳에서 자주 이래요.\" 유라가 옅게 웃는다. 생각보다 담담한 태도다.",

  talk1_envy:{bg:"lounge",sil:["yura"],speaker:"yura",
    text:"\"부러울 것도 없어요. 혼자면 편할 때도 있고, 불편할 때도 있고.\" 유라의 대답은 짧지만 단호하다.",

  talk1_joke:{bg:"lounge",sil:["yura","suhyun"],speaker:"suhyun",
    text:"\"그러니까요! 저 벽난로 옆 그림, 계속 저만 보는 것 같아요.\" 수현이 장단을 맞춘다. 유라는 살짝 당황한 듯 웃는다. \"…그런 말씀은 좀.\"",

  choice_smalltalk2:{type:"choice", bg:"lounge", sil:["yura","donghyun"], speaker:"narr",
    text:"동현도 대화에 끼어들 낌새다. 어떻게 반응할까?",
    options:[

  talk2_donghyun:{bg:"lounge",sil:["yura","donghyun"],speaker:"donghyun",
    text:"\"저는 뭐, 딱히 할 말이…\" 동현이 머쓱하게 장작을 뒤적인다. \"눈이나 안 그쳤으면 좋겠네요.\" 무뚝뚝하지만 나름의 배려가 느껴진다.",
    sfx:"none", next:"choice_smalltalk3"},
  talk2_watch:{bg:"lounge",sil:["yura","donghyun"],speaker:"narr",
    text:"동현은 별말 없이 묵묵히 장작불만 살핀다. 원래 그런 성격인 듯하다.",
    sfx:"none", next:"choice_smalltalk3"},

  choice_smalltalk3:{type:"choice", bg:"lounge", sil:["yura","suhyun"], speaker:"narr",

  talk3_tease:{bg:"lounge",sil:["yura","suhyun"],speaker:"suhyun",
    text:"\"당연하죠! 이런 게 진짜 여행 아니에요?\" 수현이 카메라를 들어 다들 있는 쪽을 슬쩍 찍는다. \"나중에 이거 보면 완전 웃길걸요.\" 유라도 피식 웃는다.",

  talk3_smile:{bg:"lounge",sil:["yura","suhyun"],speaker:"narr",

  choice_smalltalk4:{type:"choice", bg:"lounge", sil:["yura"], speaker:"narr",

    text:"혼자서는 칼을 든 사람을 이길 수 없었다. 상준은 끝내 산장으로 돌아오지 못했다."},
  endB:{title:"【엔딩 - 붙잡히지 않은 그림자】 Bad End",
    text:"무고한 동현을 범인으로 몰아 결박한 채 안심했지만, 결국 아무도 진범의 얼굴을 보지 못한 채 목숨을 잃었다."},
  endD:{title:"【엔딩 - 라면이 진짜 무서웠다】 Comic End",
    text:"아무 일도 없었다는 듯, 셋은 무사히 아침을 맞는다. 다만 유라는 끝내 돌아오지 않았다."},
  endRaccoon:{title:"【엔딩 - 혼자 먹은 라면】 Death End",
    text:"누구의 것인지 모를 냄비를, 혼자 다 비웠다. 다음 날 아침, 부엌 바닥에서 차갑게 식은 상준이 발견되었다."}
};

/* ---------------- ENGINE ---------------- */
let curId="s1", typing=false, typedTimer=null;
let flags=new Set();
const bgEl=document.getElementById("bg"), speakerEl=document.getElementById("speaker"), bodyEl=document.getElementById("body");
const choicesEl=document.getElementById("choices"), textbox=document.getElementById("textbox");
const sils=[document.getElementById("sil1"),document.getElementById("sil2"),document.getElementById("sil3")];
const CHAR_ORDER=["sangjun","suhyun","donghyun","yura"];

function showSilhouettes(list){
  const wrap = document.getElementById("silhouettes");
  wrap.classList.remove("count-1","count-2","count-3");
  const count = list ? list.length : 0;
  if(count > 0) wrap.classList.add("count-" + Math.min(count, 3));
  sils.forEach(s=>{ s.className="sil"; s.style.display="none"; });
  list.forEach((entry,i)=>{
    const el=sils[i];
    if(!el) return;
    el.style.display="";
    const name = typeof entry==="string" ? entry : entry.name;
    const pose = typeof entry==="string" ? "neutral" : (entry.pose||"neutral");
    const gender = (CHAR[name] && CHAR[name].gender) || "male";
    el.classList.add("show", gender, name);
    if(pose && pose!=="neutral") el.classList.add("pose-"+pose);
  });
}
function setBg(cls){
  if(bgEl.className.replace(" blackout","") !== cls){
    releaseTension();
    setWindIntensity(cls==="lake");
  }
  const wasBlackout = bgEl.classList.contains("blackout");
  bgEl.className=cls + (wasBlackout ? " blackout" : "");
}
function setBlackout(on){
  bgEl.classList.toggle("blackout", on);
}
function flash(){ const f=document.getElementById("flash"); f.style.transition="none"; f.style.opacity=1;
  requestAnimationFrame(()=>{ f.style.transition="opacity .4s"; f.style.opacity=0; }); }

function bloodEffect(){
  const bf=document.getElementById("bloodFlash");
  const ov=document.getElementById("bloodOverlay");
  bf.classList.remove("show"); ov.classList.remove("show");
  ov.innerHTML="";
  const count=6;
  for(let i=0;i<count;i++){
    const d=document.createElement("div");
    d.className="drip";
    const leftPct = 8 + Math.random()*84;
    d.style.left = leftPct+"%";
    d.style.width = (3+Math.random()*4)+"%";
    d.style.animationDelay = (Math.random()*0.3)+"s";
    ov.appendChild(d);
  }
  requestAnimationFrame(()=>{
    bf.classList.add("show");
    ov.classList.add("show");
  });
}

function typeText(str, cb){
  typing=true; bodyEl.textContent=""; let i=0;
  document.getElementById("cont").style.visibility="hidden";
  clearInterval(typedTimer);
  typedTimer=setInterval(()=>{
    const ch = str[i];
    bodyEl.textContent+=ch;
    if(ch && ch!==" " && ch!=="\n") sfxType();
    i++;
    if(i>=str.length){
      clearInterval(typedTimer); typing=false;
      document.getElementById("cont").textContent="다음 ▶";
      document.getElementById("cont").style.visibility="visible";
      if(cb) cb();
    }
  },28);
}
function skipType(){ clearInterval(typedTimer); typing=false; }

function silhouettesFor(sc){
  if(sc.dynamicSil){
    return ["donghyun","suhyun"];
  }
  if(sc.dynamicSil2){
    const withDH = flags.has("최종동행");
    if(curId==="s16pre" || curId==="s16"){
      const suhyunPose = flags.has("최종동행") ? "defensive" : "weapon";
      return withDH
        ? [{name:"yura",pose:"cower"}, {name:"suhyun",pose:suhyunPose}, {name:"donghyun",pose:"alert"}]
        : [{name:"yura",pose:"cower"}, {name:"suhyun",pose:suhyunPose}];
    }
    return withDH ? ["yura","suhyun","donghyun"] : ["yura","suhyun"];
  }
  return sc.sil||[];
}

function renderScene(id){
  curId=id;
  if(endings[id]){ renderEnding(id); return; }
  const sc=scenes[id];
  if(!sc) return;
  if(sc.flag) flags.add(sc.flag);
  if(sc.type==="choice"){ renderChoice(sc); return; }
  setBg(sc.bg);
  if(sc.blackout===true) setBlackout(true);
  if(sc.blackout===false) setBlackout(false);
  showSilhouettes(silhouettesFor(sc));
  speakerEl.textContent = CHAR[sc.speaker] ? CHAR[sc.speaker].name : "";
  if(sc.sfx==="glass" || sc.sfx==="thunder" || sc.sfx==="powerout") flash();
  if(sc.blood) bloodEffect();
  SFX[sc.sfx] && SFX[sc.sfx]();
  if(TENSION_SFX.has(sc.sfx)) raiseTension();
  choicesEl.classList.remove("show");
  typeText(sc.textFn ? sc.textFn() : sc.text);
}
function renderEnding(id){
  const e=endings[id];
  document.getElementById("endTitle").textContent=e.title;
  document.getElementById("endText").textContent=e.text;
  document.getElementById("endScreen").classList.add("show");
}
function renderChoice(sc){
  setBg(sc.bg);
  if(sc.blackout===true) setBlackout(true);
  if(sc.blackout===false) setBlackout(false);
  showSilhouettes(silhouettesFor(sc));
  speakerEl.textContent="";
  choicesEl.classList.remove("show");
  typeText(sc.textFn ? sc.textFn() : sc.text, ()=>{
    choicesEl.innerHTML="";
    const opts = sc.options.filter(opt => !opt.cond || flags.has(opt.cond));
    opts.forEach(opt=>{
      const b=document.createElement("button");
      b.className="choiceBtn"; b.textContent=opt.label;
      b.onclick=()=>{ SFX.click(); choicesEl.classList.remove("show"); renderScene(opt.next); };
      choicesEl.appendChild(b);
    });
    choicesEl.classList.add("show");
  });
}

function advance(){
  if(typing) return;
  const sc=scenes[curId];
  if(!sc || sc.type==="choice") return;
  if(sc.nextFn){ renderScene(sc.nextFn()); return; }
  if(sc.next) renderScene(sc.next);
}

textbox.addEventListener("click", advance);
document.getElementById("stage").addEventListener("click", e=>{
  if(e.target.closest("#choices") || e.target.closest("#volPanel") ||
     e.target.closest("#devCorner") || e.target.closest("#devPinScreen") || e.target.closest("#devPanel") ||
     e.target.closest("#titleScreen") || e.target.closest("#endScreen")) return;
  advance();
});
window.addEventListener("keydown", e=>{ if(e.code==="Space") advance(); });

document.getElementById("startBtn").onclick=()=>{
  initAudio();
  flags=new Set();
  document.getElementById("titleScreen").style.display="none";
  renderScene("s1");
};
document.getElementById("retryBtn").onclick=()=>{
  document.getElementById("endScreen").classList.remove("show");
  document.getElementById("bloodOverlay").classList.remove("show");
  document.getElementById("bloodOverlay").innerHTML="";
  document.getElementById("titleScreen").style.display="flex";
};

/* ---------------- DEV MODE ---------------- */
const DEV_PIN="1100";
let devPinInput="";

function updatePinDots(){
  const dots=document.querySelectorAll("#devPinDots .pinDot");
  dots.forEach((d,i)=>d.classList.toggle("filled", i<devPinInput.length));
}
function openPinScreen(){
  devPinInput="";
  updatePinDots();
  document.getElementById("devPinScreen").classList.add("show");
}
function closePinScreen(){
  devPinInput="";
  updatePinDots();
  document.getElementById("devPinScreen").classList.remove("show");
}
document.getElementById("devCorner").addEventListener("click", openPinScreen);
document.getElementById("devPinCancel").addEventListener("click", closePinScreen);
document.getElementById("devPinPad").addEventListener("click", e=>{
  const btn=e.target.closest("button");
  if(!btn) return;
  const k=btn.dataset.k;
  if(k==="clear"){ devPinInput=""; }
  else if(k==="back"){ devPinInput=devPinInput.slice(0,-1); }
  else if(devPinInput.length<4){ devPinInput+=k; }
  updatePinDots();
  if(devPinInput.length===4){
    if(devPinInput===DEV_PIN){
      closePinScreen();
      openDevPanel();
    } else {
      const box=document.getElementById("devPinBox");
      box.style.transition="none"; box.style.transform="translateX(-8px)";
      requestAnimationFrame(()=>{
        box.style.transition="transform .08s ease"; 
        let n=0; const shake=setInterval(()=>{
          n++; box.style.transform = n%2===0 ? "translateX(-8px)" : "translateX(8px)";
          if(n>=6){ clearInterval(shake); box.style.transform="translateX(0)"; }
        },60);
      });
      setTimeout(()=>{ devPinInput=""; updatePinDots(); }, 400);
    }
  }
});

function sceneLabel(id, sc){
  if(sc.type==="choice") return "choice";
  return "";
}
function buildDevList(){
  const list=document.getElementById("devList");
  list.innerHTML="";
  const allIds=Object.keys(scenes);
  allIds.forEach(id=>{
    const sc=scenes[id];
    const row=document.createElement("div");
    row.className="devItem"+(sc.type==="choice" ? " devChoice" : "");
    const idEl=document.createElement("span");
    idEl.className="devId";
    idEl.textContent=id+(sc.type==="choice" ? " [선택]" : "");
    const txtEl=document.createElement("span");
    txtEl.className="devTxt";
    txtEl.textContent = sc.text || (sc.textFn ? "(동적 텍스트)" : "");
    row.appendChild(idEl); row.appendChild(txtEl);
    row.onclick=()=>{
      closeDevPanel();
      document.getElementById("titleScreen").style.display="none";
      document.getElementById("endScreen").classList.remove("show");
      initAudio();
      renderScene(id);
    };
    list.appendChild(row);
  });
  Object.keys(endings).forEach(id=>{
    const e=endings[id];
    const row=document.createElement("div");
    row.className="devItem devEnding";
    const idEl=document.createElement("span");
    idEl.className="devId";
    idEl.textContent=id+" [엔딩]";
    const txtEl=document.createElement("span");
    txtEl.className="devTxt";
    txtEl.textContent=e.title;
    row.appendChild(idEl); row.appendChild(txtEl);
    row.onclick=()=>{
      closeDevPanel();
      document.getElementById("titleScreen").style.display="none";
      initAudio();
      renderScene(id);
    };
    list.appendChild(row);
  });
}
function openDevPanel(){
  buildDevList();
  document.getElementById("devPanel").classList.add("show");
}
function closeDevPanel(){
  document.getElementById("devPanel").classList.remove("show");
}
document.getElementById("devClose").addEventListener("click", closeDevPanel);

</script>
