<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>침묵의 설백호(雪白湖)</title>
<style>
  html{-webkit-text-size-adjust:none;text-size-adjust:none;}
  html,body{margin:0;padding:0;height:100%;background:#05070c;overflow:hidden;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;}
  #stage{position:relative;width:100%;height:100vh;display:flex;align-items:flex-end;justify-content:center;background:#000;}
  #bg{position:absolute;top:20%;left:20%;width:60%;height:60%;background:#05070c;background-size:cover;background-position:center;
      transition:opacity .8s;filter:contrast(1.05);}
  #bg::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.35);}
  #bg.lounge{background-image:url('night-interior-low-resolution.png');}
  #bg.room{background-image:url('dark-bedroom-photorealistic.png');}
  #bg.lake{background-image:url('night-frozen-lake.png');}
  #bg.kitchen{background-image:url('rustic-mountain-scene.png');}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;}
  #silhouettes{position:absolute;bottom:20%;left:0;width:100%;height:55%;display:flex;justify-content:center;align-items:flex-end;gap:6vw;}
  .sil{width:12vw;max-width:160px;height:38vh;background:linear-gradient(180deg,#3a6fb0,#1a3a66);
       clip-path:polygon(50% 0%,65% 8%,72% 25%,68% 40%,80% 55%,78% 100%,22% 100%,20% 55%,32% 40%,28% 25%,35% 8%);
       opacity:0;filter:drop-shadow(0 0 12px rgba(60,120,200,.5));transition:opacity .6s;}
  .sil.show{opacity:.85;}
  #textbox{position:absolute;bottom:0;left:0;width:100%;min-height:26vh;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.92) 20%);
            box-sizing:border-box;padding:24px 8vw 30px;color:#eee;font-size:1.15rem;line-height:1.8;cursor:pointer;}
  #speaker{color:#7fd0ff;font-weight:bold;margin-bottom:6px;display:block;min-height:1.2em;}
  #choices{position:absolute;bottom:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);display:none;
            flex-direction:column;align-items:center;justify-content:center;gap:16px;}
  #choices.show{display:flex;}
  .choiceBtn{background:rgba(20,40,70,.7);border:1px solid #4a7ab0;color:#dff;padding:16px 40px;font-size:1.05rem;
             border-radius:6px;cursor:pointer;width:min(70vw,520px);transition:.2s;}
  .choiceBtn:hover{background:rgba(60,110,170,.85);}
  #cont{position:absolute;right:20px;bottom:18px;color:#fff;font-size:.85rem;font-weight:bold;text-shadow:0 0 8px rgba(255,255,255,.8);
        animation:blinkCont 1s ease-in-out infinite;}
  @keyframes blinkCont{0%,100%{opacity:1;}50%{opacity:.25;}}
  #titleScreen{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;}
  #titleScreen h1{color:#8fd0ff;letter-spacing:.3em;font-size:1.8rem;margin-bottom:40px;text-shadow:0 0 20px #2a6fb0;}
  #startBtn{background:none;border:1px solid #8fd0ff;color:#8fd0ff;padding:14px 44px;font-size:1rem;cursor:pointer;letter-spacing:.2em;}
  #startBtn:hover{background:rgba(143,208,255,.15);}
  #endScreen{position:absolute;inset:0;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;text-align:center;padding:0 10vw;}
  #endScreen.show{display:flex;}
  #endScreen h2{color:#ffcf7f;font-size:1.6rem;margin-bottom:20px;letter-spacing:.15em;}
  #endScreen p{color:#ccc;line-height:1.8;font-size:1.05rem;}
  #retryBtn{margin-top:30px;background:none;border:1px solid #888;color:#ccc;padding:10px 30px;cursor:pointer;}

  /* volume control (applies to ALL background sound + all SFX via master gain) */
  #volPanel{position:absolute;top:14px;right:14px;z-index:30;background:rgba(10,15,25,.75);border:1px solid #345;
             border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:8px;color:#cde;font-size:.85rem;
             font-family:monospace;user-select:none;}
  #volPanel button{background:rgba(60,90,130,.5);border:1px solid #567;color:#dff;width:30px;height:30px;border-radius:6px;
                    cursor:pointer;font-size:1rem;line-height:1;}
  #volPanel button:hover{background:rgba(90,130,180,.7);}
  #volBarWrap{width:80px;height:8px;background:#223;border-radius:4px;overflow:hidden;}
  #volBar{height:100%;width:70%;background:linear-gradient(90deg,#3a7abf,#7fd0ff);transition:width .15s;}
  #volPct{width:34px;text-align:right;}

  @media (max-width:600px){
    #textbox{font-size:.95rem;min-height:30vh;padding:16px 5vw 22px;}
    .sil{width:20vw;height:34vh;}
    #silhouettes{gap:2vw;bottom:24%;}
    .choiceBtn{width:82vw;padding:14px 20px;font-size:.95rem;}
    #volPanel{top:8px;right:8px;padding:6px 8px;gap:5px;font-size:.72rem;}
    #volPanel button{width:24px;height:24px;font-size:.8rem;}
    #volBarWrap{width:44px;}
    #titleScreen h1{font-size:1.2rem;letter-spacing:.15em;text-align:center;padding:0 6vw;}
    #endScreen h2{font-size:1.2rem;}
    #endScreen p{font-size:.95rem;}
  }
  @media (max-height:500px) and (orientation:landscape){
    #textbox{min-height:34vh;}
    .sil{height:28vh;}
  }
</style>
</head>
<body>
<div id="stage">
  <div id="bg" class="lounge"></div>
  <div id="flash"></div>
  <div id="silhouettes">
    <div class="sil" id="sil1"></div>
    <div class="sil" id="sil2"></div>
    <div class="sil" id="sil3"></div>
  </div>
  <div id="textbox"><span id="speaker"></span><span id="body"></span></div>
  <div id="cont" style="visibility:hidden;">다음 ▶</div>
  <div id="choices"></div>

  <div id="titleScreen">
    <h1>침묵의 설백호 (雪白湖)</h1>
    <button id="startBtn">시작하기</button>
  </div>

  <div id="endScreen">
    <h2 id="endTitle"></h2>
    <p id="endText"></p>
    <button id="retryBtn">처음으로</button>
  </div>

  <div id="volPanel">
    <button id="muteBtn">🔊</button>
    <button id="volDown">-</button>
    <div id="volBarWrap"><div id="volBar"></div></div>
    <span id="volPct">70%</span>
    <button id="volUp">+</button>
  </div>
</div>

<script>
/* ---------------- AUDIO (all routed through master gain -> volume control affects everything) ---------------- */
let actx=null, master=null, muted=false, volume=0.7, lastVolume=0.7;
let windNodes=null, droneNodes=null, windIndoor=0.35, windOutdoor=0.85;

function initAudio(){
  if(actx) return;
  actx=new (window.AudioContext||window.webkitAudioContext)();
  master=actx.createGain();
  master.gain.value=volume;
  master.connect(actx.destination);
  startWind();
  startDrone();
}
function noiseBuffer(){
  const b=actx.createBuffer(1, actx.sampleRate*2, actx.sampleRate);
  const d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  return b;
}
function startWind(){
  const src=actx.createBufferSource();
  src.buffer=noiseBuffer(); src.loop=true;
  const filt=actx.createBiquadFilter(); filt.type="lowpass"; filt.frequency.value=500;
  const g=actx.createGain(); g.gain.value=windIndoor;
  src.connect(filt); filt.connect(g); g.connect(master);
  src.start();
  windNodes={src,filt,g};
  // slow LFO on filter freq for blizzard gust effect
  const lfo=actx.createOscillator(); lfo.frequency.value=0.09;
  const lfoGain=actx.createGain(); lfoGain.gain.value=280;
  lfo.connect(lfoGain); lfoGain.connect(filt.frequency); lfo.start();
}
function setWindIntensity(outdoor){
  if(!actx || !windNodes) return;
  const now=actx.currentTime;
  const target = outdoor ? windOutdoor : windIndoor;
  windNodes.g.gain.cancelScheduledValues(now);
  windNodes.g.gain.setValueAtTime(windNodes.g.gain.value, now);
  windNodes.g.gain.linearRampToValueAtTime(target, now+1.0);
}
function sfxGust(){
  if(!actx) return;
  const now=actx.currentTime;
  const src=actx.createBufferSource(); src.buffer=noiseBuffer(); src.loop=false;
  const filt=actx.createBiquadFilter(); filt.type="lowpass"; filt.frequency.value=350;
  const g=actx.createGain(); g.gain.value=0.001;
  src.connect(filt); filt.connect(g); g.connect(master);
  g.gain.setValueAtTime(0.001, now);
  g.gain.linearRampToValueAtTime(0.6, now+0.4);
  g.gain.linearRampToValueAtTime(0.001, now+1.8);
  src.start(now); src.stop(now+1.8);
  // sharp whistle overlay
  const o=actx.createOscillator(); o.type="sine";
  const og=actx.createGain(); og.gain.value=0.001;
  o.connect(og); og.connect(master);
  o.frequency.setValueAtTime(900, now);
  o.frequency.linearRampToValueAtTime(1400, now+0.6);
  o.frequency.linearRampToValueAtTime(700, now+1.4);
  og.gain.setValueAtTime(0.001, now);
  og.gain.linearRampToValueAtTime(0.12, now+0.4);
  og.gain.linearRampToValueAtTime(0.001, now+1.6);
  o.start(now); o.stop(now+1.7);
}
function startDrone(){
  const o1=actx.createOscillator(); o1.type="sine"; o1.frequency.value=55;
  const o2=actx.createOscillator(); o2.type="sine"; o2.frequency.value=58;
  const g=actx.createGain(); g.gain.value=0.05;
  o1.connect(g); o2.connect(g); g.connect(master);
  o1.start(); o2.start();
  droneNodes={o1,o2,g};
}
function sfxClick(){
  if(!actx) return;
  const o=actx.createOscillator(); o.type="square"; o.frequency.value=800;
  const g=actx.createGain(); g.gain.value=0.06;
  o.connect(g); g.connect(master);
  g.gain.setValueAtTime(0.06,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.05);
  o.start(); o.stop(actx.currentTime+0.06);
}
function sfxGlass(){
  if(!actx) return;
  const src=actx.createBufferSource(); src.buffer=noiseBuffer();
  const filt=actx.createBiquadFilter(); filt.type="highpass"; filt.frequency.value=2500;
  const g=actx.createGain(); g.gain.value=0.85;
  src.connect(filt); filt.connect(g); g.connect(master);
  g.gain.setValueAtTime(0.85,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.4);
  src.start(); src.stop(actx.currentTime+0.4);
}
function sfxScream(){
  if(!actx) return;
  const now=actx.currentTime;
  const o=actx.createOscillator(); o.type="sawtooth";
  const g=actx.createGain(); g.gain.value=0.001;
  const filt=actx.createBiquadFilter(); filt.type="bandpass"; filt.frequency.value=1200; filt.Q.value=6;
  o.connect(filt); filt.connect(g); g.connect(master);
  o.frequency.setValueAtTime(600, now);
  o.frequency.exponentialRampToValueAtTime(1500, now+0.5);
  o.frequency.exponentialRampToValueAtTime(2000, now+0.85);
  g.gain.setValueAtTime(0.001, now);
  g.gain.exponentialRampToValueAtTime(0.75, now+0.5);
  g.gain.exponentialRampToValueAtTime(0.9, now+0.85);
  g.gain.setValueAtTime(0.0001, now+0.86); // cut off abruptly at the peak, no fade-down
  o.start(now); o.stop(now+0.9);
  const src=actx.createBufferSource(); src.buffer=noiseBuffer();
  const nf=actx.createBiquadFilter(); nf.type="bandpass"; nf.frequency.value=2000; nf.Q.value=2;
  const ng=actx.createGain(); ng.gain.value=0.15;
  src.connect(nf); nf.connect(ng); ng.connect(master);
  ng.gain.setValueAtTime(0.001, now);
  ng.gain.linearRampToValueAtTime(0.25, now+0.85);
  ng.gain.setValueAtTime(0.0001, now+0.86);
  src.start(now); src.stop(now+0.9);
}
function sfxReveal(){
  if(!actx) return;
  const now=actx.currentTime;
  // two soft, muted taps — "타탁" — not sharp or startling
  [0, 0.12].forEach((t,i)=>{
    const o=actx.createOscillator(); o.type="sine"; o.frequency.value= i===0 ? 180 : 150;
    const g=actx.createGain(); g.gain.value=0.001;
    const filt=actx.createBiquadFilter(); filt.type="lowpass"; filt.frequency.value=900;
    o.connect(filt); filt.connect(g); g.connect(master);
    g.gain.setValueAtTime(0.001, now+t);
    g.gain.linearRampToValueAtTime(0.22, now+t+0.015);
    g.gain.exponentialRampToValueAtTime(0.001, now+t+0.13);
    o.start(now+t); o.stop(now+t+0.14);
  });
}
function sfxHeartbeat(){
  if(!actx) return;
  [0,0.35].forEach(t=>{
    const o=actx.createOscillator(); o.type="sine"; o.frequency.value=60;
    const g=actx.createGain(); g.gain.value=0.3;
    o.connect(g); g.connect(master);
    g.gain.setValueAtTime(0.3,actx.currentTime+t);
    g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+t+0.25);
    o.start(actx.currentTime+t); o.stop(actx.currentTime+t+0.3);
  });
}
function sfxThunder(){
  if(!actx) return;
  const src=actx.createBufferSource(); src.buffer=noiseBuffer();
  const filt=actx.createBiquadFilter(); filt.type="lowpass"; filt.frequency.value=200;
  const g=actx.createGain(); g.gain.value=0.95;
  src.connect(filt); filt.connect(g); g.connect(master);
  g.gain.setValueAtTime(0.95,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+1.2);
  src.start(); src.stop(actx.currentTime+1.2);
}
function sfxPowerOut(){
  if(!actx) return;
  const o=actx.createOscillator(); o.type="sine"; o.frequency.value=50;
  const g=actx.createGain(); g.gain.value=0.85;
  o.connect(g); g.connect(master);
  g.gain.setValueAtTime(0.85,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.5);
  o.start(); o.stop(actx.currentTime+0.5);
  const src=actx.createBufferSource(); src.buffer=noiseBuffer();
  const filt=actx.createBiquadFilter(); filt.type="bandpass"; filt.frequency.value=1800; filt.Q.value=4;
  const g2=actx.createGain(); g2.gain.value=0.4;
  src.connect(filt); filt.connect(g2); g2.connect(master);
  g2.gain.setValueAtTime(0.4,actx.currentTime);
  g2.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.25);
  src.start(); src.stop(actx.currentTime+0.25);
}
let tensionHeld=false, tensionTremolo=null;
function raiseTension(){
  if(!actx || !droneNodes) return;
  const now=actx.currentTime;
  const peak=0.26;
  tensionHeld=true;
  droneNodes.g.gain.cancelScheduledValues(now);
  droneNodes.g.gain.setValueAtTime(droneNodes.g.gain.value, now);
  droneNodes.g.gain.linearRampToValueAtTime(peak, now+0.3);
  if(tensionTremolo){ tensionTremolo.stop(); tensionTremolo=null; }
  const o=actx.createOscillator(); o.type="sine"; o.frequency.value=61.5;
  const og=actx.createGain(); og.gain.value=0;
  o.connect(og); og.connect(master);
  og.gain.setValueAtTime(0, now);
  og.gain.linearRampToValueAtTime(0.1, now+0.3);
  o.start(now);
  tensionTremolo={stop:()=>{ try{ og.gain.cancelScheduledValues(actx.currentTime); og.gain.linearRampToValueAtTime(0, actx.currentTime+1); o.stop(actx.currentTime+1.1); }catch(e){} }};
}
function releaseTension(){
  if(!actx || !droneNodes || !tensionHeld) return;
  const now=actx.currentTime;
  const base=0.05;
  tensionHeld=false;
  droneNodes.g.gain.cancelScheduledValues(now);
  droneNodes.g.gain.setValueAtTime(droneNodes.g.gain.value, now);
  droneNodes.g.gain.linearRampToValueAtTime(base, now+1.2);
  if(tensionTremolo){ tensionTremolo.stop(); tensionTremolo=null; }
}
const SFX={click:sfxClick, glass:sfxGlass, heartbeat:sfxHeartbeat, thunder:sfxThunder, powerout:sfxPowerOut, scream:sfxScream, gust:sfxGust, reveal:sfxReveal, none:()=>{}};
const TENSION_SFX=new Set(["glass","thunder","powerout","heartbeat","scream"]);

function applyVolume(){
  document.getElementById("volPct").textContent=Math.round((muted?0:volume)*100)+"%";
  document.getElementById("volBar").style.width=(muted?0:volume*100)+"%";
  document.getElementById("muteBtn").textContent=muted?"🔇":"🔊";
  if(master) master.gain.value = muted?0:volume; // single master bus: covers wind, drone, and every SFX
}
document.getElementById("volUp").onclick=()=>{ initAudio(); volume=Math.min(1,+(volume+0.1).toFixed(2)); if(muted){muted=false;} applyVolume(); };
document.getElementById("volDown").onclick=()=>{ initAudio(); volume=Math.max(0,+(volume-0.1).toFixed(2)); applyVolume(); };
document.getElementById("muteBtn").onclick=()=>{
  initAudio();
  if(!muted){ lastVolume=volume; muted=true; }
  else { muted=false; volume=lastVolume; }
  applyVolume();
};
window.addEventListener("keydown",e=>{
  if(e.key==="m"||e.key==="M") document.getElementById("muteBtn").click();
  if(e.key==="[") document.getElementById("volDown").click();
  if(e.key==="]") document.getElementById("volUp").click();
});
applyVolume();

/* ---------------- SCENARIO ---------------- */
const CHAR={
  sangjun:{name:"상준(나)"}, suhyun:{name:"수현"}, donghyun:{name:"동현"}, yura:{name:"유라"}, narr:{name:""}
};

const scenes={
  // ---- 프롤로그: 도착 & 인물 소개 ----
  s1:{bg:"lounge",sil:[],speaker:"narr",
    text:"폭설이 그칠 줄 모르고 쏟아지던 밤. 산길이 끊긴 끝에 만난 산장 '백설장'. 상준과 일행은 하나둘 거실로 모여든다.",
    sfx:"none", next:"s1b"},
  s1b:{bg:"lounge",sil:["suhyun"],speaker:"narr",
    text:"수현은 상준의 회사 입사 동기다. 입사 첫날부터 카메라를 들고 다니던, 늘 먼저 말을 걸어오는 성격.",
    sfx:"none", next:"s2"},
  s2:{bg:"lounge",sil:["suhyun"],speaker:"suhyun",
    text:"\"와, 진짜 이러다 며칠은 못 나가는 거 아니에요?\" 수현이 젖은 카메라 가방을 내려놓으며 웃는다. 이런 상황에서도 재미있어하는 눈치다.",
    sfx:"none", next:"s3intro"},
  s3intro:{bg:"lounge",sil:["donghyun"],speaker:"narr",
    text:"현관 쪽에서 한 남자가 들어온다. 처음 보는 얼굴이다. 이 산장 관리인인가 — 체격이 다부지고, 말수가 적어 보인다.",
    sfx:"none", next:"s3"},
  s3:{bg:"lounge",sil:["donghyun"],speaker:"donghyun",
    text:"\"이 산장 관리인 최동현입니다. 이 정도 눈이면… 오늘은 다들 여기서 묵으셔야 할 겁니다.\" 동현이 무뚝뚝하게 인사를 건넨다. 짧은 한마디였지만, 손은 이미 능숙하게 벽난로 장작을 정리하고 있다.",
    sfx:"none", next:"s4intro"},
  s4intro:{bg:"lounge",sil:["yura"],speaker:"narr",
    text:"조금 늦게, 또 한 사람이 들어온다. 이쪽도 초면이다. 누구와도 시선을 오래 마주치지 않는 여자다.",
    sfx:"none", next:"s4"},
  s4:{bg:"lounge",sil:["yura"],speaker:"yura",
    text:"\"…안녕하세요. 저는 이유라예요. 혼자 여행 중이었는데, 오늘은 여기서 묵으려고요.\" 짧은 자기소개 후, 다시 말이 없어진다.",
    sfx:"none", next:"s5"},
  s5:{bg:"lounge",sil:["yura"],speaker:"yura",
    text:"\"저는 먼저 좀 쉴게요. 두통이 있어서.\" 유라는 그렇게 말하고 2층으로 올라간다. 곧 방문 닫히는 소리가 들린다.",
    sfx:"none", next:"s5b"},
  s5b:{bg:"lounge",sil:["suhyun"],speaker:"suhyun",
    text:"\"저도 화장실 좀 다녀올게요.\" 수현이 자리에서 일어나 잠시 자리를 비운다.",
    sfx:"none", next:"s6"},
  s6:{bg:"lounge",sil:[],speaker:"narr",
    text:"얼마 지나지 않아 수현이 돌아와 다시 자리에 앉는다. 세 사람만 남은 거실. 창밖 눈보라 소리와 벽난로 장작 타는 소리만 나직이 흐른다.",
    sfx:"none", next:"s7"},

/* ---------------- ENGINE ---------------- */
let curId="s1", typing=false, typedTimer=null;
let flags=new Set();
const bgEl=document.getElementById("bg"), speakerEl=document.getElementById("speaker"), bodyEl=document.getElementById("body");
const choicesEl=document.getElementById("choices"), textbox=document.getElementById("textbox");
const sils=[document.getElementById("sil1"),document.getElementById("sil2"),document.getElementById("sil3")];
const CHAR_ORDER=["sangjun","suhyun","donghyun","yura"];

function showSilhouettes(list){
  sils.forEach(s=>s.classList.remove("show"));
  list.forEach((name,i)=>{ if(sils[i]){ sils[i].classList.add("show"); } });
}
function setBg(cls){
  if(bgEl.className !== cls){
    releaseTension();
    setWindIntensity(cls==="lake");
  }
  bgEl.className=cls;
}
function flash(){ const f=document.getElementById("flash"); f.style.transition="none"; f.style.opacity=1;
  requestAnimationFrame(()=>{ f.style.transition="opacity .4s"; f.style.opacity=0; }); }

function typeText(str, cb){
  typing=true; bodyEl.textContent=""; let i=0;
  document.getElementById("cont").style.visibility="hidden";
  clearInterval(typedTimer);
  typedTimer=setInterval(()=>{
    bodyEl.textContent+=str[i]; i++;
    if(i>=str.length){
      clearInterval(typedTimer); typing=false;
      document.getElementById("cont").textContent="다음 ▶";
      document.getElementById("cont").style.visibility="visible";
      if(cb) cb();
    }
  },28);
}
function skipType(){ clearInterval(typedTimer); typing=false; }

function renderScene(id){
  curId=id;
  if(endings[id]){ renderEnding(id); return; }
  const sc=scenes[id];
  if(!sc) return;
  if(sc.flag) flags.add(sc.flag);
  if(sc.type==="choice"){ renderChoice(sc); return; }
  setBg(sc.bg);
  showSilhouettes(sc.sil||[]);
  speakerEl.textContent = CHAR[sc.speaker] ? CHAR[sc.speaker].name : "";
  if(sc.sfx==="glass" || sc.sfx==="thunder" || sc.sfx==="powerout") flash();
  SFX[sc.sfx] && SFX[sc.sfx]();
  if(TENSION_SFX.has(sc.sfx)) raiseTension();
  choicesEl.classList.remove("show");
  typeText(sc.textFn ? sc.textFn() : sc.text);
}
function renderEnding(id){
  const e=endings[id];
  document.getElementById("endTitle").textContent=e.title;
  document.getElementById("endText").textContent=e.text;
  document.getElementById("endScreen").classList.add("show");
}
function renderChoice(sc){
  setBg(sc.bg); showSilhouettes(sc.sil||[]);
  speakerEl.textContent="";
  choicesEl.classList.remove("show");
  typeText(sc.text, ()=>{
    choicesEl.innerHTML="";
    sc.options.forEach(opt=>{
      const b=document.createElement("button");
      b.className="choiceBtn"; b.textContent=opt.label;
      b.onclick=()=>{ SFX.click(); choicesEl.classList.remove("show"); renderScene(opt.next); };
      choicesEl.appendChild(b);
    });
    choicesEl.classList.add("show");
  });
}

function advance(){
  if(typing) return;
  const sc=scenes[curId];
  if(!sc || sc.type==="choice") return;
  if(sc.nextFn){ renderScene(sc.nextFn()); return; }
  if(sc.next) renderScene(sc.next);
}

textbox.addEventListener("click", advance);
document.getElementById("stage").addEventListener("click", e=>{
  if(e.target.closest("#choices") || e.target.closest("#volPanel") ||
     e.target.closest("#titleScreen") || e.target.closest("#endScreen")) return;
  advance();
});
window.addEventListener("keydown", e=>{ if(e.code==="Space") advance(); });

document.getElementById("startBtn").onclick=()=>{
  initAudio();
  flags=new Set();
  document.getElementById("titleScreen").style.display="none";
  renderScene("s1");
};
document.getElementById("retryBtn").onclick=()=>{
  document.getElementById("endScreen").classList.remove("show");
  document.getElementById("titleScreen").style.display="flex";
};
</script>
