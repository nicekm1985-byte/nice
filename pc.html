<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">

<title>에일리언 프론티어</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow-y:hidden;overflow-x:auto;touch-action:none}
#ctrlZone{display:none}
canvas{display:block;margin:0 auto;height:min(100dvh,100dvw*4/3);width:min(100dvw,100dvh*3/4);image-rendering:pixelated}
button{font:12px monospace;padding:6px 10px;background:#222;color:#fff;border:1px solid #666;border-radius:4px}
#shop{position:fixed;z-index:5;top:0;left:50%;transform:translateX(-50%);height:min(100dvh,100dvw*4/3);width:min(100dvw,100dvh*3/4);display:none;container-type:size;flex-direction:column;gap:1.1cqh;padding:2cqh 3cqw;box-sizing:border-box;overflow:hidden;
 font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;color:#e8ecf0;cursor:default;user-select:none;-webkit-user-select:none;
 background:radial-gradient(ellipse at 50% 28%,rgba(255,200,80,.13),transparent 55%),repeating-linear-gradient(90deg,#1a1e24 0 2px,#22272e 2px 40px);box-shadow:inset 0 0 60px #000}

#menu .mt{font:900 20px Menlo,monospace;letter-spacing:.3em;color:#ffd84a;text-align:center}

#dCode.bad{border-color:#ff4a5a;animation:dshake .3s}@keyframes dshake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#dev #dOk{background:#ffd040;color:#2a1e00}
#dPanel .dt{font:800 12px Menlo,monospace;color:#7cf0a0;letter-spacing:.06em}
#dBoss{display:grid;grid-template-columns:1fr 1fr;gap:6px}#dev #dBoss button{background:#3a2a30;color:#ffd8e0;padding:8px 4px;font-size:12px;line-height:1.3}#dev #dBoss button small{display:block;color:#c08a98;font-size:10px;font-weight:600}

#map .sky{flex:1;min-height:0;perspective:110cqh;perspective-origin:50% 0}
#map .board{position:relative;height:100%;transform:rotateX(26deg) scale(.94);transform-origin:50% 90%;transform-style:preserve-3d;
 background:radial-gradient(ellipse at 50% 100%,rgba(60,140,255,.18),transparent 70%),repeating-linear-gradient(0deg,rgba(90,160,255,.08) 0 1px,transparent 1px 6cqh),repeating-linear-gradient(90deg,rgba(90,160,255,.08) 0 1px,transparent 1px 6cqh);
 border:1px solid rgba(90,160,255,.25);border-radius:10px}

#map line{stroke-width:2px} #map line.av{stroke:#9ad8ff;stroke-dasharray:4 3;animation:flow 1s linear infinite} #map line.done{stroke:#ffd040;stroke-dasharray:none}
@keyframes flow{to{stroke-dashoffset:-14}}
#map .nd{position:absolute;transform:translate(-50%,-50%) translateZ(2px);width:6.4cqh;height:6.4cqh;border-radius:50%;border:2px solid var(--c);background:radial-gradient(circle at 35% 30%,#3a4660,#141a28);
 color:#fff;font-size:2.6cqh;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;cursor:pointer;box-shadow:0 .8cqh 0 #05070c,0 0 0 transparent;transition:transform .15s}
#map .nd small{position:absolute;top:100%;margin-top:.2cqh;font-size:1.25cqh;font-weight:700;white-space:nowrap;color:#c8d4e8;text-shadow:0 1px 2px #000}
#map .nd.boss{width:8.4cqh;height:8.4cqh;font-size:3.4cqh}
#map .nd.lock{opacity:.38;filter:grayscale(.7);cursor:default} #map .nd.vis{opacity:.75;border-color:#ffd040;cursor:default}
#map .nd.av{animation:pulse 1.1s ease-in-out infinite} #map .nd.av:hover{transform:translate(-50%,-50%) translateZ(2px) scale(1.1)}
#map .nd.sel{transform:translate(-50%,-50%) translateZ(2px) scale(1.15);background:radial-gradient(circle at 35% 30%,#5a6a90,#1c2438);box-shadow:0 .8cqh 0 #05070c,0 0 2.5cqh var(--c)}
@keyframes pulse{50%{box-shadow:0 .8cqh 0 #05070c,0 0 2.2cqh var(--c)}}
#map .me{position:absolute;width:6cqh;transform:translate(-50%,-125%);filter:drop-shadow(0 .6cqh 0 rgba(0,0,0,.6));animation:bob 1.6s ease-in-out infinite;pointer-events:none}
@keyframes bob{50%{margin-top:-.8cqh}}
#map .info{background:rgba(4,8,20,.7);border:1px solid #2a3a5a;border-radius:8px;padding:1.2cqh 3cqw;display:flex;flex-direction:column;gap:.6cqh;min-height:14cqh}
#map .info .t{font-weight:800;font-size:2.4cqh} #map .info .d{font-size:1.75cqh;color:#a8b8d0;line-height:1.45;flex:1}
#map .info button{font:800 2.4cqh/1 -apple-system,sans-serif;letter-spacing:.12em;padding:1.5cqh;border:0;border-radius:8px;cursor:pointer;background:linear-gradient(#ffe070,#f0b020);color:#2a1e00}
#map .info button:disabled{background:#2a3242;color:#6a7890;cursor:default}
#map .ev{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6cqh;text-align:center;background:rgba(10,6,24,.72);border:1px solid #5a3a8a;border-radius:12px;padding:3cqh 5cqw;box-shadow:0 0 40px rgba(140,80,255,.25) inset}
#map .evic{font-size:10cqh;line-height:1;filter:drop-shadow(0 0 2cqh rgba(170,110,255,.7));animation:bob 2s ease-in-out infinite}
#map .evt{font:900 3.6cqh/1.1 -apple-system,"Apple SD Gothic Neo",sans-serif;color:#d8c4ff;letter-spacing:.06em}
#map .evd{font-size:2cqh;line-height:1.6;color:#c4c8dc;min-height:9cqh}
#map .evc{display:flex;flex-direction:column;gap:1.2cqh;width:100%}
#map .evc button{display:flex;flex-direction:column;gap:.5cqh;align-items:flex-start;text-align:left;padding:1.4cqh 3cqw;border:1px solid #6a4aa8;border-radius:10px;background:linear-gradient(#2c2244,#1c1630);color:#f0eaff;cursor:pointer}
#map .evc button b{font-size:2.15cqh} #map .evc button small{font-size:1.6cqh;color:#a898c8}
#map .evc button:hover:not(:disabled){border-color:#b07aff;box-shadow:0 0 2cqh rgba(170,110,255,.45)}
#map .evc button:disabled{opacity:.4;cursor:default}
#map .cred{height:15cqh;overflow:hidden;mask-image:linear-gradient(transparent,#000 25%,#000 75%,transparent);-webkit-mask-image:linear-gradient(transparent,#000 25%,#000 75%,transparent);width:100%}
#map .cred div{animation:roll 14s linear infinite}#map .cred p{margin:.5cqh 0;font-size:1.7cqh;color:#c8b8f0}@keyframes roll{from{transform:translateY(15cqh)}to{transform:translateY(-100%)}}
#map .evc button.ok{align-items:center;background:linear-gradient(#ffe070,#f0b020);color:#2a1e00;border:0;font:800 2.4cqh/1 -apple-system,sans-serif;letter-spacing:.12em;padding:1.6cqh}
@media(pointer:coarse),(hover:none){#shop .hd b{font-size:7cqh}#shop .hd span{font-size:3.2cqh}#shop .st{font-size:3cqh}#shop .own{font-size:2.6cqh}#shop .cat{font-size:2.4cqh}#shop .nm{font-size:3.5cqh}#shop .lv{font-size:2.5cqh}#shop .ds{font-size:2.6cqh;line-height:1.4}#shop button{font-size:3.2cqh}#shop .ic{font-size:5.5cqh}
#map .mhd b{font-size:4.4cqh}#map .mhd span{font-size:2.3cqh}#map .nd small{font-size:1.6cqh}#map .nd{font-size:3.3cqh}#map .nd.boss{font-size:4.2cqh}#map .info .t{font-size:3cqh}#map .info .d{font-size:2.2cqh;line-height:1.5}#map .info button{font-size:3cqh}#map .evt{font-size:4.4cqh}#map .evd{font-size:2.5cqh}#map .evc button b{font-size:2.7cqh}#map .evc button small{font-size:2cqh}#map .evc button.ok{font-size:3cqh}#map .cred p{font-size:2.1cqh}
body{display:flex;flex-direction:column;align-items:center;height:100dvh}
#shop,#map{width:100dvw!important;height:100dvh!important}
canvas{height:80dvh;aspect-ratio:3/4;flex:0 0 auto;display:block}
body.full canvas{width:100dvw;height:100dvh;max-width:none;aspect-ratio:auto}
body.full #ctrlZone{display:none!important}
#ctrlZone{display:flex!important;flex:0 0 auto;height:20dvh;min-height:0;width:100dvw;position:relative;box-sizing:border-box;touch-action:none;
  background:linear-gradient(#1c2026,#101317);border-top:1px solid #4a5660;
  background-image:linear-gradient(#1c2026,#101317),repeating-linear-gradient(0deg,rgba(140,170,200,.06) 0 1px,transparent 1px 10px),repeating-linear-gradient(90deg,rgba(140,170,200,.06) 0 1px,transparent 1px 10px);
  background-blend-mode:normal,screen,screen}
#ctrlZone::before{content:'';position:absolute;top:0;left:8%;right:8%;height:1px;background:linear-gradient(90deg,transparent,rgba(120,200,255,.7),transparent)}
#ctrlZone .cz-label{position:absolute;top:6px;left:50%;transform:translateX(-50%);font:700 10px Menlo,monospace;letter-spacing:.25em;color:rgba(154,208,255,.55)}
#ctrlZone .cz-corner{position:absolute;width:10px;height:10px;border:1px solid rgba(154,208,255,.45)}
#ctrlZone .cz-corner.tl{top:5px;left:5px;border-right:0;border-bottom:0}
#ctrlZone .cz-corner.tr{top:5px;right:5px;border-left:0;border-bottom:0}
#ctrlZone .cz-corner.bl{bottom:5px;left:5px;border-right:0;border-top:0}
#ctrlZone .cz-corner.br{bottom:5px;right:5px;border-left:0;border-top:0}
}
</style></head><body>
<canvas id="c" width="240" height="320"></canvas>
<canvas id="hi" style="position:fixed;display:none;pointer-events:none;z-index:1"></canvas>
<div id="ctrlZone"><span class="cz-corner tl"></span><span class="cz-corner tr"></span><span class="cz-corner bl"></span><span class="cz-corner br"></span><span class="cz-label">CONTROL ZONE</span></div>
<div id="menu"><div class="mbox"><div class="mt">MENU</div>
<label class="row mute"><span>🔇 음소거</span><input type="checkbox" id="vMute"></label>
<label class="row"><span>전체</span><input type="range" id="vMaster" min="0" max="100"><b id="tMaster"></b></label>
<label class="row"><span>배경음</span><input type="range" id="vBgm" min="0" max="100"><b id="tBgm"></b></label>
<label class="row"><span>효과음</span><input type="range" id="vSfx" min="0" max="100"><b id="tSfx"></b></label>

<div style="margin:4px 0 8px"><button id="dHangar" style="width:100%">🛠 격납고(정비 상점) 바로 입장</button></div>

<div class="dbar"><button id="dWMax">전부 최대</button><button id="dWClr">전부 해제</button></div>
<div class="dt">🛠 DEV · 보스전 바로 시작</div><div id="dBoss"></div>

<label class="row mute"><span>풀장비 (무기·방어 최대)</span><input type="checkbox" id="dFull"></label>
<button id="dOff">개발자 모드 끄기</button></div></div>
<button id="mClose">계속하기 ▶</button><button id="mQuit">타이틀로</button></div></div>
<div id="shop"></div>
<div id="map"></div>
<script>
const cv=document.getElementById('c'),CTX0=cv.getContext('2d');let ctx=CTX0;
const IS_MOBILE_UA=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.platform));
const W=240,H=IS_MOBILE_UA?384:320,CX=W/2,SPEED=40;   // 스크롤 속도 (px/s)   // 모바일은 세로 비율을 더 길게
cv.width=W;cv.height=H;
const LAYERS=[{f:1,shade:0},{f:.78,shade:.3},{f:.6,shade:.55}];   // 위(가까움) → 아래(멂)
let camX=0;   // 좌우 카메라 오프셋 (지면·지상 유닛 공통)

// ---------- 스테이지 진행 (초 단위로 정의 → 월드 거리 px로 환산) ----------
// 줄 하나 70초. 화면에 보이는 범위(아래 scroll ~ 위 scroll+8초, 클리어 연출 +2.6초) 안에 다른 지형이 섞이지 않도록
// 지형 전환은 줄과 줄 사이 빈 구간(지도 화면 동안 건너뜀)에 둠. 단, 3줄은 시작 직후 도시가 갈라지는 장면부터 보여 줌
// 1줄 바다(0~70) → 2줄 도시(88~158) → 3줄 갈라짐→협곡(166~236) → 4줄 다시 도시(258~328) → 5줄 황무지(342~412) → 보스(420)
const sec=t=>t*SPEED;
const CITY_S=sec(86), OPEN_A=sec(170),OPEN_B=sec(178);  // 도시 진입 / 도시가 갈라짐
const CANYON_S=sec(186);                               // 지표가 숲으로 = 협곡 한가운데
const CLOSE_A=sec(248),CLOSE_B=sec(256),CITY2_S=sec(254); // 협곡이 다시 닫히며 도시로
const WASTE_S=sec(340);                                // 황무지 시작

// ---------- 텍스처 ----------
function rng(s){return()=>(s=(s*16807)%2147483647)/2147483647}
const hex=s=>[1,3,5].map(i=>parseInt(s.substr(i,2),16));
function pixTile(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),d=x.createImageData(w,h);
  for(let y=0;y<h;y++)for(let i=0;i<w;i++)d.data.set([...fn(i,y),255],(y*w+i)*4);
  x.putImageData(d,0,0);return{pat:ctx.createPattern(c,'repeat'),w,h}}
function drawTile(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'));return{pat:ctx.createPattern(c,'repeat'),w,h}}

const GREEN=pixTile(16,12,(x,y)=>{const row=y/6|0,cy=y%6,cx=(x+(row%2)*4)%8,d=((cx-3.5)/4)**2+((cy-2)/3.6)**2;
  if(d>1)return hex('#0a3a10');if(cy<2&&cx<4)return hex('#86e050');if(d>.55)return hex('#1f7a22');return hex('#3fae35')});

// 도시: 랜덤 분할(BSP) 도로망 + 빌딩가/주택가/공원 + 가로수 + 옥상 디테일
function tree(g,r,x,y,R){
  g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.arc(x+1.5,y+1.5,R,0,7);g.fill();
  g.fillStyle=r()<.5?'#4f8a3a':'#3e7a30';g.beginPath();g.arc(x,y,R,0,7);g.fill();
  g.fillStyle='#7cbc5a';g.fillRect(x-R/2|0,y-R/2|0,1,1)}
function roofDetail(g,r,x,y,w,h){
  if(w>=26&&h>=26&&r()<.35){const cx=x+w/2|0,cy=y+h/2|0,R=Math.min(w,h)/2-3;   // 헬리패드
    g.fillStyle='#55555c';g.beginPath();g.arc(cx,cy,R,0,7);g.fill();
    g.strokeStyle='#e8e8e8';g.lineWidth=1;g.beginPath();g.arc(cx,cy,R-2,0,7);g.stroke();
    g.fillStyle='#e8e8e8';g.fillRect(cx-4,cy-4,2,9);g.fillRect(cx+2,cy-4,2,9);g.fillRect(cx-2,cy,4,1);return}
  const P=()=>[x+3+r()*Math.max(1,w-9)|0,y+3+r()*Math.max(1,h-9)|0];
  if(w>12&&h>10&&r()<.55){const [px,py]=P();g.fillStyle='rgba(0,0,0,.35)';g.fillRect(px+2,py+2,6,5);   // 계단실
    g.fillStyle='#c4c0b8';g.fillRect(px,py,6,5);g.fillStyle='#8a867e';g.fillRect(px,py+4,6,1)}
  for(let k=w*h>500?2:1;k>0;k--)if(r()<.6){const [px,py]=P(),R=2+r()*2|0;            // 물탱크
    g.fillStyle='rgba(0,0,0,.4)';g.beginPath();g.arc(px+R+2,py+R+2,R+1,0,7);g.fill();
    g.fillStyle='#6a5a4a';g.beginPath();g.arc(px+R,py+R,R+1,0,7);g.fill();
    g.fillStyle='#9a8a78';g.beginPath();g.arc(px+R,py+R,R,0,7);g.fill();
    g.fillStyle='#c8b8a4';g.fillRect(px+R-1,py+R-1,1,1)}
  if(r()<.5){const [px,py]=P();                                                         // 안테나
    g.strokeStyle='rgba(0,0,0,.5)';g.lineWidth=1;g.beginPath();g.moveTo(px+.5,py+.5);g.lineTo(px+6.5,py+9.5);g.stroke();
    g.fillStyle='#bbb';g.fillRect(px-1,py+1,3,1);g.fillStyle='#eee';g.fillRect(px,py,1,2);g.fillStyle='#ff4040';g.fillRect(px,py-1,1,1)}
  for(let k=r()*(w*h/150)|0;k>0;k--){const [px,py]=P();                                // 실외기
    g.fillStyle='rgba(0,0,0,.4)';g.fillRect(px+1,py+1,3,3);g.fillStyle='#cfd3da';g.fillRect(px,py,3,3)}
}
const CITY_ROOFS=[];   // 지상 유닛이 차지할 수 있는 큰 옥상 [x,y,w,h]
const CITY=drawTile(256,256,g=>{const r=rng(11),S=256,roofs=['#9aa0aa','#a8a090','#8898a8','#b0a898','#8a8f96','#a09080','#b8b0a4','#7e8a94'];
  g.fillStyle='#3c3c44';g.fillRect(0,0,S,S);
  const blocks=[],roads=[];
  (function split(x,y,w,h,d){
    if(d>=5||(w<70&&h<70&&(d>=3||r()<.5))||(w<34||h<34)){blocks.push([x,y,w,h]);return}
    const rw=r()<.3?8:5,vert=w>h?r()<.85:r()<.15,len=vert?w:h,c=len*(.3+r()*.4)|0;
    if(vert){roads.push([x+c,y,rw,h,1]);split(x,y,c,h,d+1);split(x+c+rw,y,w-c-rw,h,d+1)}
    else{roads.push([x,y+c,w,rw,0]);split(x,y,w,c,d+1);split(x,y+c+rw,w,h-c-rw,d+1)}
  })(4,4,S-8,S-8,0);
  // 차선: 넓은 도로 + 타일 경계 순환 도로
  g.fillStyle='#d8c050';
  for(const [x,y,w,h,v] of [...roads,[S-4,0,8,S,1],[0,S-4,S,8,0]]){if((v?w:h)<8)continue;
    if(v){const cx=x+w/2|0;for(let i=y;i<y+h;i+=8)g.fillRect(cx%S,i,1,4)}else{const cy=y+h/2|0;for(let i=x;i<x+w;i+=8)g.fillRect(i,cy%S,4,1)}}
  for(const [bx,by,bw,bh] of blocks){
    g.fillStyle='#74747c';g.fillRect(bx,by,bw,bh);                                        // 인도
    g.fillStyle='#d8d8d8';for(let k=2;k<bw-2;k+=2)if(r()<.12){g.fillRect(bx+k,by-3,1,2)}  // 드문드문 횡단보도
    for(let k=4;k<bw-2;k+=7+(r()*5|0))if(r()<.55){tree(g,r,bx+k,by+1,1.6);tree(g,r,bx+k,by+bh-1,1.6)}   // 가로수
    const ix=bx+2,iy=by+2,iw=bw-4,ih=bh-4;
    if(r()<.15){                                                                          // 공원
      g.fillStyle='#3a6a2e';g.fillRect(ix,iy,iw,ih);
      for(let k=iw*ih/40|0;k>0;k--)tree(g,r,ix+2+r()*(iw-4),iy+2+r()*(ih-4),1.5+r()*2.5);
      g.fillStyle='#b8a888';g.fillRect(ix,iy+(ih/2|0),iw,1);g.fillRect(ix+(iw/2|0),iy,1,ih);   // 산책로
      continue}
    const B=[],house=r()<.4;                                                              // 주택가 / 빌딩가
    if(house){g.fillStyle='#5a7a40';g.fillRect(ix,iy,iw,ih);                              // 마당 잔디
      for(let t=0;t<60&&B.length<10;t++){
        const w=9+r()*7|0,h=8+r()*6|0,x=ix+1+(r()*(iw-w-1)|0),y=iy+1+(r()*(ih-h-1)|0);
        if(w>iw-2||h>ih-2||B.some(b=>x<b[0]+b[2]+3&&b[0]<x+w+3&&y<b[1]+b[3]+3&&b[1]<y+h+3))continue;
        B.push([x,y,w,h])}
      const HR=[['#b04a3a','#7e3026'],['#4a6a9a','#30486e'],['#8a6a4a','#5e4630'],['#6a8a5a','#46603a'],['#a0a0a8','#6e6e76']];
      for(const [x,y,w,h] of B){const [c1,c2]=HR[r()*HR.length|0];
        g.fillStyle='rgba(0,0,0,.4)';g.fillRect(x+2,y+2,w,h);
        if(r()<.5){g.fillStyle=c1;g.fillRect(x,y,w,h/2|0);g.fillStyle=c2;g.fillRect(x,y+(h/2|0),w,h-(h/2|0));   // 박공지붕(가로 용마루)
          g.fillStyle='rgba(255,255,255,.3)';g.fillRect(x,y+(h/2|0)-1,w,1)}
        else{g.fillStyle=c2;g.fillRect(x,y,w,h);g.fillStyle=c1;g.fillRect(x,y,w/2|0,h);                          // 박공지붕(세로 용마루)
          g.fillStyle='rgba(255,255,255,.3)';g.fillRect((x+w/2|0)-1,y,1,h)}
        if(r()<.4){g.fillStyle='#5a4a40';g.fillRect(x+2+(r()*(w-5)|0),y+1,2,2)}}                                 // 굴뚝
      for(let k=iw*ih/90|0;k>0;k--){const tx=ix+2+r()*(iw-4),ty=iy+2+r()*(ih-4);           // 마당 나무
        if(B.some(b=>tx>b[0]-2&&tx<b[0]+b[2]+1&&ty>b[1]-2&&ty<b[1]+b[3]+1))continue;tree(g,r,tx,ty,1.2+r()*1.5)}
      continue}
    for(let t=0;t<40&&B.length<6;t++){
      const w=Math.min(iw,8+r()*Math.min(36,iw)|0),h=Math.min(ih,8+r()*Math.min(36,ih)|0);
      const x=ix+(r()*(iw-w+1)|0),y=iy+(r()*(ih-h+1)|0);
      if(B.some(b=>x<b[0]+b[2]+2&&b[0]<x+w+2&&y<b[1]+b[3]+2&&b[1]<y+h+2))continue;
      B.push([x,y,w,h,2+r()*9|0])}
    B.sort((a,b)=>a[4]-b[4]);
    for(const [x,y,w,h,ht] of B){
      const s=ht*.7;g.fillStyle='rgba(0,0,0,.45)';g.fillRect(x+s,y+s,w,h);           // 높이 그림자
      g.fillStyle=roofs[r()*roofs.length|0];g.fillRect(x,y,w,h);
      g.fillStyle='rgba(255,255,255,.25)';g.fillRect(x,y,w,1);g.fillRect(x,y,1,h);
      g.fillStyle='rgba(0,0,0,.35)';g.fillRect(x,y+h-1,w,1);g.fillRect(x+w-1,y,1,h);
      if(w>=14&&h>=14&&w<=30&&h<=30)CITY_ROOFS.push([x,y,w,h]);
      roofDetail(g,r,x,y,w,h)}
  }});

// ---------- 지형 함수 ----------
const mod=(v,t)=>((v%t)+t)%t;
const sstep=(a,b,v)=>{const t=Math.max(0,Math.min(1,(v-a)/(b-a)));return t*t*(3-2*t)};
const hash=n=>{const v=Math.sin(n*127.1)*43758.5453;return v-Math.floor(v)};
const step=(s,k)=>hash(Math.floor(s/10)+k)*6;
const jag=(s,k)=>Math.max(1-sstep(CANYON_S-100,CANYON_S+100,s),sstep(CITY2_S-100,CITY2_S+100,s))*hash(Math.floor(s/6)+k*17)*9;   // 도시 단면은 더 거칠게
const offL=(s,k)=>78+14*Math.sin(s*.008+k)+7*Math.sin(s*.021+k*2)+step(s,k*31)+jag(s,k);
const offR=(s,k)=>78+14*Math.sin(s*.007+k+1)+7*Math.sin(s*.019+k*3)+step(s,k*57+9)+jag(s,k+5);
const openAt=s=>sstep(OPEN_A,OPEN_B,s)*(1-sstep(CLOSE_A,CLOSE_B,s));   // 열렸다가 다시 닫힘
const depthAt=s=>1-sstep(SHALLOW_A,SHALLOW_B,s);

function fillPat(T,ox,oy,clips){ctx.save();for(const c of clips){ctx.beginPath();c();ctx.clip()}
  ctx.translate(Math.round(mod(ox,T.w)),Math.round(mod(oy,T.h)));ctx.fillStyle=T.pat;
  ctx.fillRect(-T.w,-T.h,W+T.w*2,H+T.h*2);ctx.restore()}
// 좌우 벽 폴리곤의 감기 방향을 통일 (반대 방향이면 겹친 가운데가 nonzero 규칙에서 비어 구덩이처럼 보임)
function band(edge,outerX){const e=outerX>CX?[...edge].reverse():edge;
  ctx.moveTo(outerX,e[0][1]);for(const p of e)ctx.lineTo(p[0],p[1]);ctx.lineTo(outerX,e[e.length-1][1]);ctx.closePath()}
function rim(a,dx,cols,w){ctx.lineWidth=w;let cur=null,prev=null;   // 구간별 색, 닫힌 행은 끊음, 얕아질수록(d→0) 투명
  for(const p of a){const al=Math.round(p[4]*10)/10,c=p[2]&&al>0?cols[p[3]]+'|'+al:null;
    if(c!==cur){if(cur)ctx.stroke();cur=c;if(c){ctx.strokeStyle=cols[p[3]];ctx.globalAlpha=al;ctx.beginPath();const q=prev&&prev[2]?prev:p;ctx.moveTo(q[0]+dx,q[1])}}
    if(c)ctx.lineTo(p[0]+dx,p[1]);prev=p}
  if(cur)ctx.stroke();ctx.globalAlpha=1}
// 지표 경계선: 월드 x에 고정된 부드러운 곡선 (카메라가 좌우로 움직여도 모양이 변하지 않음)
function edgeY(x,yb,ox,seed,amp=1){const wx=x+ox;return yb+amp*(3*Math.sin(wx*.045+seed)+2*Math.sin(wx*.11+seed*2.3))}
function aboveEdge(yb,ox,seed,amp){return()=>{ctx.moveTo(-10,-10);ctx.lineTo(W+10,-10);
  for(let x=W+10;x>=-10;x-=2)ctx.lineTo(x,edgeY(x,yb,ox,seed,amp));ctx.closePath()}}
function edgeBand(yb,ox,seed,amp,d0,d1){ctx.beginPath();   // 경계선 아래 d0~d1 픽셀 띠
  for(let x=-10;x<=W+10;x+=2)ctx.lineTo(x,edgeY(x,yb,ox,seed,amp)+d0);
  for(let x=W+10;x>=-10;x-=2)ctx.lineTo(x,edgeY(x,yb,ox,seed,amp)+d1);ctx.closePath()}
const ell=(x,y,rx,ry,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);ctx.fill()};
const seg=(a,b,c,d,w,col)=>{ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke()};

function computeLayers(camX){
  const P=[];
  for(let i=0;i<LAYERS.length;i++){
    const f=F(LAYERS[i].f),dep=LAYERS[i].f,s0=scroll*f,cx=CX-camX*f;
    const Z=(i?LOW_Z:TOP_Z).map(z=>({...z,s:z.s?z.s*f+(1-f)*H:0}));   // 깊은 층은 경계도 늦게 지나감
    const left=[],right=[];
    for(let j=0;j<ROWS.length;j++){
      const y=ROWS[j],sw=scroll+H-y,o=openAt(sw),d=depthAt(sw),s=s0+H-y;
      let xl=cx-(offL(s,i)*dep*o-(1-o)*20),xr=cx+(offR(s,i)*dep*o-(1-o)*20);
      if(i){const T=P[0];xl=T.left[j][0]+(xl-T.left[j][0])*d;xr=T.right[j][0]+(xr-T.right[j][0])*d}   // 얕아지면 위층에 합쳐짐
      if(d<=.02){xl=-12;xr=W+12}   // 완전히 얕아진 행은 벽을 화면 밖으로 → 경계 세로선이 남지 않음
      const vis=xr-xl>1&&d>.03,z=zIdx(Z,s);
      left.push([xl,y,vis,z,d]);right.push([xr,y,vis,z,d]);
    }
    P.push({left,right,Z,f,s0});
  }
  return P;
}
function drawLayer(i,P,camX){
  const {left,right,Z,f,s0}=P[i],L=LAYERS[i],ox=camX*f;
  const wall=()=>{band(left,-10);band(right,W+10)};
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.beginPath();
  band(left.map(p=>[p[0]+5*p[4],p[1]]),-10);band(right.map(p=>[p[0]-5*p[4],p[1]]),W+10);ctx.fill();
  fillPat(Z[zIdx(Z,s0-10)].tex,-ox,s0,[wall]);
  for(let z=1;z<Z.length;z++){const sb=Z[z].s;if(sb<=s0-12||sb>s0+H+12)continue;
    const yb=s0+H-sb,seed=z*13+i*5,amp=Z[z].amp??1,kind=i?'':Z[z].edge;
    fillPat(Z[z].tex,-ox,s0,[wall,aboveEdge(yb,ox,seed,amp)]);
    ctx.save();ctx.beginPath();wall();ctx.clip();
    if(kind==='wall'){                                        // 도시 방파제: 높은 지대가 해변 위에 올라앉음
      ctx.fillStyle='#7a7a82';edgeBand(yb,ox,seed,amp,0,5);ctx.fill();          // 콘크리트 옹벽 면
      ctx.fillStyle='#c8c8d0';edgeBand(yb,ox,seed,amp,0,1);ctx.fill();          // 상단 모서리 하이라이트
      ctx.fillStyle='rgba(0,0,0,.3)';edgeBand(yb,ox,seed,amp,5,11);ctx.fill()}  // 해변에 드리운 그림자
    else if(kind==='lavaedge'){                               // 용암 → 현무암: 빛나는 가장자리
      const p=.6+.3*Math.sin(performance.now()/260);ctx.fillStyle=`rgba(255,170,60,${p})`;edgeBand(yb,ox,seed,amp,-1,2);ctx.fill();ctx.fillStyle='#2a1a14';edgeBand(yb,ox,seed,amp,2,6);ctx.fill();
      ctx.fillStyle='rgba(255,90,20,.35)';edgeBand(yb,ox,seed,amp,6,14);ctx.fill()}
    else if(kind==='metaledge'){                              // 착륙장 → 기지: 경고 줄무늬 격벽
      ctx.fillStyle='#14181e';edgeBand(yb,ox,seed,amp,0,6);ctx.fill();ctx.save();ctx.clip();for(let x=mod(-ox,10)-10;x<W+10;x+=10){ctx.fillStyle='#e0c020';ctx.beginPath();ctx.moveTo(x,yb-4);ctx.lineTo(x+5,yb-4);ctx.lineTo(x+1,yb+8);ctx.lineTo(x-4,yb+8);ctx.fill()}ctx.restore();
      ctx.fillStyle='rgba(0,0,0,.4)';edgeBand(yb,ox,seed,amp,6,13);ctx.fill()}
    else if(kind==='icecliff'){                               // 빙붕 절벽: 푸른 얼음 단면 + 바다에 드리운 그림자 + 물가 거품
      ctx.fillStyle='#5aa0dc';edgeBand(yb,ox,seed,amp,0,8);ctx.fill();ctx.fillStyle='#2a64a8';edgeBand(yb,ox,seed,amp,5,8);ctx.fill();
      ctx.fillStyle='#ffffff';edgeBand(yb,ox,seed,amp,0,1.3);ctx.fill();ctx.fillStyle='rgba(0,15,40,.35)';edgeBand(yb,ox,seed,amp,8,18);ctx.fill();
      ctx.fillStyle='rgba(230,248,255,.75)';edgeBand(yb,ox,seed,amp,8,9.3);ctx.fill()}
    else if(kind==='foam'){                                   // 해변 → 바다: 밀려오는 파도 거품
      const w=Math.sin(performance.now()/700)*1.5;
      ctx.fillStyle='rgba(240,250,255,.85)';edgeBand(yb,ox,seed,amp,0,2);ctx.fill();
      ctx.fillStyle='rgba(200,230,255,.45)';edgeBand(yb,ox,seed,amp,4+w,5.5+w);ctx.fill()}
    else{ctx.fillStyle='rgba(0,0,0,.45)';edgeBand(yb,ox,seed,amp,0,2);ctx.fill()}
    ctx.restore()}
  if(L.shade){ctx.fillStyle=`rgba(${TH.shade},${L.shade})`;ctx.beginPath();wall();ctx.fill()}
  const rims=Z.map(z=>z.rim),cuts=Z.map(z=>z.cut);
  rim(left,0,rims,1);rim(right,0,rims,1);rim(left,1.5,cuts,2);rim(right,-1.5,cuts,2);
}

// ---------- 보스: 다관절 거미 ----------
const HIP=[[7,-8],[9,-3],[9,3],[7,8]], REST=[[38,-38],[48,-14],[48,10],[40,34]];   // 뒤 → 앞(머리는 아래쪽)
function makeBoss(){const b={x:CX,y:-90,t:0,hp:Math.round(BOSS_HP*(1+.35*DF())),maxHp:Math.round(BOSS_HP*(1+.35*DF())),fanT:3,flash:0,webT:2.5,misT:4.5,salvo:0,salvoT:0,hatch:0,mouth:0,lastG:1,dead:0,legs:[]};
  for(const s of[-1,1])for(let i=0;i<4;i++)b.legs.push({s,i,g:(i+(s>0))%2,fx:b.x+s*REST[i][0],fy:b.y+REST[i][1],st:-1,lift:0});
  return b}
const restX=(b,l)=>b.x+l.s*REST[l.i][0], restY=(b,l)=>b.y+REST[l.i][1];
function knee(hx,hy,fx,fy,cx,cy){const L1=30,L2=34,dx=fx-hx,dy=fy-hy,a=Math.atan2(dy,dx),d=Math.min(Math.hypot(dx,dy),L1+L2-.5)||1;
  const bb=Math.acos(Math.max(-1,Math.min(1,(L1*L1+d*d-L2*L2)/(2*L1*d))));
  const k1=[hx+L1*Math.cos(a+bb),hy+L1*Math.sin(a+bb)],k2=[hx+L1*Math.cos(a-bb),hy+L1*Math.sin(a-bb)];
  return Math.hypot(k1[0]-cx,k1[1]-cy)>Math.hypot(k2[0]-cx,k2[1]-cy)?k1:k2}   // 무릎은 몸 바깥쪽으로

function updateBoss(b,dt){
  b.t+=dt;b.flash=Math.max(0,b.flash-dt);b.mouth=Math.max(0,b.mouth-dt*2.5);
  const px=b.x,py=b.y;
  if(!b.dead){if(b.t<3)b.y=-90+180*sstep(0,1,b.t/3);else{const t=b.t-3;b.x=CX+55*Math.sin(t*.45);b.y=90+10*Math.sin(t*.9)}}
  const vx=(b.x-px)/dt,vy=(b.y-py)/dt,gv=SPEED*mult;
  // 다리: 땅에 붙은 발은 지면과 함께 흘러가고, 멀어지면 트라이포드 그룹 단위로 한 걸음
  for(const l of b.legs){
    if(l.st<0){l.fy+=gv*dt;continue}
    l.sy+=gv*dt;l.ty+=gv*dt;l.st=Math.min(1,l.st+dt/.16);
    const e=sstep(0,1,l.st);l.fx=l.sx+(l.tx-l.sx)*e;l.fy=l.sy+(l.ty-l.sy)*e;l.lift=Math.sin(l.st*Math.PI);
    if(l.st>=1){l.st=-1;l.lift=0}
  }
  if(!b.legs.some(l=>l.st>=0))for(const g of[1-b.lastG,b.lastG]){
    if(!b.legs.some(l=>l.g===g&&Math.hypot(l.fx-restX(b,l),l.fy-restY(b,l))>14))continue;
    const lx=Math.max(-18,Math.min(18,vx*.2)),ly=Math.max(-18,Math.min(18,(vy-gv)*.2));
    for(const l of b.legs)if(l.g===g){l.sx=l.fx;l.sy=l.fy;l.tx=restX(b,l)+lx;l.ty=restY(b,l)+ly;l.st=0}
    b.lastG=g;break}
  if(b.dead||b.t<3.5)return;
  const p2=b.hp<b.maxHp/2;
  // 거미줄: 입에서 플레이어 방향으로
  if((b.webT-=dt)<=0){b.webT=p2?2:3;b.mouth=1;const mx=b.x,my=b.y+26,a=Math.atan2(ship.y-my,ship.x-mx);
    for(const o of p2?[-.5,-.25,0,.25,.5]:[-.3,0,.3])webs.push({x:mx,y:my,vx:Math.cos(a+o)*75,vy:Math.sin(a+o)*75,t:0,r:3,rot:0});SFX.web()}
  // 미사일 다발: 복부 해치에서 좌우 교대 발사 → 유도
  if((b.misT-=dt)<=0){b.misT=p2?3.2:4.6;b.salvo=p2?18:12;b.salvoT=.45}
  if(b.salvo>0&&(b.salvoT-=dt)<=0){b.salvoT=.07;const s=b.salvo%2?1:-1;b.salvo--;
    SFX.missile();missiles.push({x:b.x+s*14,y:b.y-30+(Math.random()-.5)*8,a:s>0?-.5:Math.PI+.5,v:40,t:0,sm:0})}
  b.hatch+=((b.salvo>0?1:0)-b.hatch)*Math.min(1,dt*10);
  // 새 패턴: 다리 끝 8곳에서 동시에 조준탄 (2페이즈는 2연발)
  if((b.fanT-=dt)<=0){b.fanT=p2?1.9:2.7;b.fanN=p2?2:1;b.fanD=0}
  if(b.fanN>0&&(b.fanD-=dt)<=0){b.fanD=.22;b.fanN--;for(const l of b.legs)shoot(l.fx,l.fy,aimA(l.fx,l.fy),p2?96:84)}
}
function drawLeg(b,l,shadow){
  const hx=b.x+l.s*HIP[l.i][0],hy=b.y+HIP[l.i][1],[kx,ky]=knee(hx,hy,l.fx,l.fy,b.x,b.y),fx=l.fx,fy=l.fy,lf=l.lift;
  const ux=fx-kx,uy=fy-ky,ul=Math.hypot(ux,uy)||1,tx=fx+ux/ul*6,ty=fy+uy/ul*6;
  if(shadow){const c='rgba(0,0,0,.35)';ctx.lineCap='round';   // 발이 땅에 닿으면 그림자와 겹침, 무릎이 가장 높음
    seg(hx+6,hy+8,kx+9,ky+12,4,c);seg(kx+9,ky+12,fx+lf*6,fy+lf*8,3,c);return}
  const o='#14101a';
  seg(hx,hy,kx,ky,6+lf,o);seg(kx,ky,fx,fy,4.5+lf,o);seg(fx,fy,tx,ty,3,o);
  seg(hx,hy,kx,ky,4+lf,'#5e5470');seg(kx,ky,fx,fy,2.6+lf,'#7a6e8e');seg(fx,fy,tx,ty,1.6,'#d04848');
  ell(kx,ky,3.4+lf*.6,3.4+lf*.6,o);ell(kx,ky,2.4+lf*.6,2.4+lf*.6,'#a89cbc');ell(fx,fy,1.8,1.8,'#8a7e9e');
}
function drawBoss(b,now){
  const {x,y}=b,p2=b.hp<b.maxHp/2;
  ctx.lineCap='round';
  for(const l of b.legs)drawLeg(b,l,true);
  ell(x+7,y-6,24,40,'rgba(0,0,0,.4)');
  for(const l of b.legs)drawLeg(b,l,false);
  // 복부
  ell(x,y-28,24,28,'#14101a');ell(x,y-28,22,26,'#3e3550');ell(x-7,y-38,6,8,'#5a4e70');
  ctx.strokeStyle='#b02a2a';ctx.lineWidth=2;
  for(const yy of[-44,-34,-24]){ctx.beginPath();ctx.moveTo(x-9,y+yy);ctx.lineTo(x,y+yy+5);ctx.lineTo(x+9,y+yy);ctx.stroke()}
  for(const s of[-1,1]){const hx=x+s*14-3,hy=y-36;   // 미사일 해치
    ctx.fillStyle='#0a0a0e';ctx.fillRect(hx,hy,6,12);
    if(b.hatch>.1){ctx.fillStyle=`rgba(255,80,40,${b.hatch})`;ctx.fillRect(hx+1,hy+1,4,10)}
    ctx.fillStyle='#6a6080';ctx.fillRect(hx,hy,6,12*(1-b.hatch));}
  // 두흉부 + 머리
  ell(x,y,17,16,'#14101a');ell(x,y,15,14,'#4a4060');ell(x-5,y-5,5,4,'#6a5e82');
  ctx.strokeStyle='#2a2238';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y-12);ctx.lineTo(x,y+8);ctx.stroke();
  ell(x,y+15,11,9,'#14101a');ell(x,y+15,10,8,'#3a3248');
  const glow=p2?.7+.3*Math.sin(now/80):1;
  ctx.fillStyle=`rgba(255,${p2?60:40},40,${glow})`;
  for(const [ex,ey] of[[-4,12],[4,12],[-7,15],[7,15],[-2,17],[2,17]])ctx.fillRect(x+ex-1,y+ey-1,2,2);
  const m=b.mouth;ctx.lineWidth=2;ctx.strokeStyle='#d8d0c0';   // 독니(거미줄 발사 시 벌어짐)
  for(const s of[-1,1]){ctx.beginPath();ctx.moveTo(x+s*3,y+21);ctx.quadraticCurveTo(x+s*(5+3*m),y+26,x+s*(2+2*m),y+29);ctx.stroke()}
  if(b.flash>0){ctx.globalAlpha=.7;ell(x,y-28,22,26,'#fff');ell(x,y,15,14,'#fff');ell(x,y+15,10,8,'#fff');ctx.globalAlpha=1}
}
// ---------- 주인공 기체: 픽셀 스프라이트 (17×19, 3프레임: 정면/좌뱅크/우뱅크) ----------
const SHIP_ART=[
'........A........',
'.......ABA.......',
'.......BCB.......',
'......ABWBA......',
'......BCWCB......',
'......BCCCB......',
'.....ABCDCBA.....',
'..R..BCDDDCB..R..',
'..A.ABCCDCCBA.A..',
'..AABBCCCCCBBAA..',
'.ABBBCCCECCCBBBA.',
'ABBCCCCEEECCCCBBA',
'ABCCCDCCECCDCCCBA',
'.AABBDCCCCCDBBAA.',
'...AABCCCCCBAA...',
'....ABBCGCBBA....',
'....AB.GGG.BA....',
'....AA.G.G.AA....',
'.................'];
const SHIP_PAL={A:'#1a2240',B:'#3a54b0',C:'#6a8ae8',D:'#b8c8ff',W:'#e8f4ff',E:'#ff4a3a',R:'#ff3030',G:'#4a4a58'};
const SHIP_IMG=(()=>{const c=document.createElement('canvas');c.width=17*3;c.height=19;const g=c.getContext('2d');
  for(let f=0;f<3;f++)for(let y=0;y<19;y++)for(let x=0;x<17;x++){
    let ch=SHIP_ART[y][x];
    if(f){const near=f===1?x<8:x>8,far=!near&&x!==8;   // 뱅크: 가까운 날개 밝게, 먼 날개 어둡게·좁게
      if(far&&Math.abs(x-8)>6&&y>8)ch='.';
      else if(near&&ch==='B')ch='C';else if(far&&ch==='C')ch='B'}
    if(ch!=='.'){g.fillStyle=SHIP_PAL[ch];g.fillRect(f*17+x,y,1,1)}}
  return c})();
// 주인공 탄: 진행 방향(+x)으로 뾰족한 다이아몬드 화살촉. 꼬리→촉 그라데이션 + 위아래 면 음영 + 잔광
const BUL=(()=>{const c=document.createElement('canvas');c.width=18;c.height=8;const g=c.getContext('2d');
  const tr=g.createLinearGradient(0,0,9,0);tr.addColorStop(0,'rgba(80,170,255,0)');tr.addColorStop(1,'rgba(140,215,255,.65)');g.fillStyle=tr;g.fillRect(0,3,9,2);
  const d=g.createLinearGradient(6,0,17.5,0);d.addColorStop(0,'#1848c8');d.addColorStop(.55,'#58c8ff');d.addColorStop(1,'#ffffff');g.fillStyle=d;
  g.beginPath();g.moveTo(17.5,4);g.lineTo(10,.6);g.lineTo(6,4);g.lineTo(10,7.4);g.closePath();g.fill();
  const v=g.createLinearGradient(0,.6,0,7.4);v.addColorStop(0,'rgba(255,255,255,.55)');v.addColorStop(.5,'rgba(255,255,255,0)');v.addColorStop(1,'rgba(0,20,80,.35)');g.fillStyle=v;g.fill();
  g.fillStyle='rgba(255,255,255,.9)';g.beginPath();g.moveTo(16,4);g.lineTo(11,2.6);g.lineTo(9,4);g.lineTo(11,5.4);g.closePath();g.fill();return c})();
const SHIP_SHADOW=(()=>{const c=document.createElement('canvas');c.width=51;c.height=19;const g=c.getContext('2d');
  g.drawImage(SHIP_IMG,0,0);g.globalCompositeOperation='source-in';g.fillStyle='rgba(0,0,0,.4)';g.fillRect(0,0,51,19);return c})();
function drawShip(x,y,bank,now){
  const f=bank<-.35?1:bank>.35?2:0;
  ctx.drawImage(SHIP_SHADOW,f*17,0,17,19,x-8+6,y-9+10,17,19);                          // 지면 그림자(실루엣)
  const fl=(now/45|0)%3;                                                                // 애프터버너
  ctx.fillStyle='rgba(80,160,255,.5)';ctx.fillRect(x-2,y+8,5,4+fl*2);
  ctx.fillStyle='#bfe4ff';ctx.fillRect(x-1,y+8,3,2+fl);
  ctx.fillStyle='#fff';ctx.fillRect(x,y+8,1,2);
  ctx.drawImage(SHIP_IMG,f*17,0,17,19,x-8,y-9,17,19);
  if((now/250|0)%2){ctx.fillStyle=f===2?'#ff8080':'#ff3030';ctx.fillRect(x-6,y-2,1,1);ctx.fillStyle=f===1?'#80ff80':'#30ff60';ctx.fillRect(x+6,y-2,1,1)}  // 항법등
}
function drawWeb(x,y,r,rot,al){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.strokeStyle=`rgba(240,240,255,${al})`;ctx.lineWidth=1;ctx.beginPath();
  for(let k=0;k<8;k++){const a=k*Math.PI/4;ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}

function bgmPlay(name){audioInit();if(SND.song===name)return;SND.song=name;SND.step=0;SND.nextT=SND.ac?SND.ac.currentTime+.05:0;
  if(SND.ac&&name){const s=SONGS[name],v=s.vol*(IS_MOBILE&&!/^boss/.test(name)?.7:1);SND.bgm.gain.cancelScheduledValues(SND.ac.currentTime);SND.bgm.gain.setTargetAtTime(v,SND.ac.currentTime,.3)}}
function bgmStop(){SND.song=null;if(SND.ac)SND.bgm.gain.setTargetAtTime(0,SND.ac.currentTime,.25)}
function bgmTick(){   // 매 프레임 호출: 0.12초 앞까지 미리 예약
  if(!ok()||!SND.song)return;const s=SONGS[SND.song],sp=60/s.bpm/4,ac=SND.ac,B=SND.bgm;
  if(SND.nextT<ac.currentTime-.2)SND.nextT=ac.currentTime+.02;
  while(SND.nextT<ac.currentTime+.12){const i=SND.step%16,bar=(SND.step>>4)%4,t=SND.nextT+(s.swing&&i%2?sp*s.swing:0);
    if(s.kick[i])tone(150,.18,{type:'sine',vol:.5,f2:55,dest:B,t});                       // 킥: 55Hz에서 멈춤(초저역 회피)
    if(s.snare[i])noise(.14,{vol:.22,lp:5000,hp:900,dest:B,t});
    if(s.hat[i])noise(.035,{vol:i%4===2?.07:.04,lp:11000,hp:7000,dest:B,t});
    const b=s.bass[i];if(b)tone(NOTE(b),sp*1.6,{type:s.bw||'sawtooth',vol:s.bv??.16,lp:s.blp||900,q:4,dest:B,t});
    const l=s.lead[SND.step%s.lead.length];if(l)tone(NOTE(l),sp*(s.lsus||1.8),{type:s.lw||'triangle',vol:s.lv??.09,dest:B,t,at:.01,lp:s.lp||0});
    if(s.arp)tone(NOTE(s.arp[SND.step%s.arp.length]+(bar===2?-2:bar===3?-4:0)),sp*.9,{type:'sine',vol:s.av,dest:B,t,at:.005});
    if(i===0)for(const n of s.pad[bar])tone(NOTE(n),sp*15,{type:s.pw||'sine',vol:s.pv??.035,dest:B,t,at:.3,lp:s.plp||0});
    SND.nextT+=sp;SND.step++}
}

function spawnEnemy(type,x,y,extra){const e={type,x,y,t:0,hp:Math.ceil(ET[type].hp*(1+.25*lvl)*(run.elite?1.6:1)),flash:0,...extra};ET[type].init(e);if(extra&&extra.vx!==undefined)e.vx=extra.vx;enemies.push(e)}
function spawnWave(){
  const zone=run.mode==='treasure'?TREASURE_Z:(EASY?SPAWN1:SPAWN).find(z=>scroll<z.until);if(!zone)return;
  const list=zone.list.filter(([n])=>!(n==='mother'&&enemies.some(e=>e.type==='mother')));
  let r=Math.random()*list.reduce((a,b)=>a+b[1],0),name=list[0][0];for(const [n,w] of list)if((r-=w)<0){name=n;break}
  const rx=()=>24+Math.random()*(W-48);
  if(name==='drone'){const n=3+(Math.random()*2|0),x=rx();for(let i=0;i<n;i++)spawnEnemy(name,x,-14-i*30)}
  else if(name==='saucer'){const cx=50+Math.random()*(W-100);for(let i=0;i<3;i++)spawnEnemy(name,cx+(i-1)*26,-14-Math.abs(i-1)*16)}
  else if(name==='dart'){for(let i=0;i<2;i++)spawnEnemy(name,rx(),-14-i*26)}
  else if(name==='swarm'){const x=rx(),n=8+(Math.random()*3|0);for(let i=0;i<n;i++)spawnEnemy(name,x+(Math.random()-.5)*40,-10-Math.random()*50)}
  else if(name==='squid'){const s=Math.random()<.5,y=20+Math.random()*50;for(let i=0;i<3;i++)spawnEnemy(name,s?-14-i*24:W+14+i*24,y)}
  else if(name==='mine')spawnEnemy(name,Math.random()<.5?-16:W+16,40+Math.random()*50);
  else if(name==='crawler'||name==='nest'){   // 지상 배치: 화면 위 지면에 고정, 협곡 구덩이·바다 위에는 놓지 않음
    if(groundLook(-30)==='city'){   // 도시: 빈 건물 옥상 하나를 통째로 차지
      const sp=cityRoofSpots().filter(q=>!enemies.some(e=>e.bw&&Math.abs(e.x-q.sx)<q.w&&Math.abs(e.y-q.sy)<q.h));if(!sp.length)return;
      for(const q of sp.sort(()=>Math.random()-.5).slice(0,name==='nest'?1:2))spawnEnemy(name,q.sx,q.sy,{bw:q.w,bh:q.h});return}
    const sw=scroll+H+14;if(openAt(sw+40)>.02&&depthAt(sw+40)>.02)return;if(!groundLook(-20))return;
    const n=name==='nest'?1+(Math.random()*2|0):2+(Math.random()*2|0),gap=name==='nest'?60:32,x0=30+Math.random()*(W-60-(n-1)*gap);
    for(let i=0;i<n;i++)spawnEnemy(name,x0+i*gap+(Math.random()-.5)*6,-18-(Math.random()*20|0))}
  else spawnEnemy(name,rx(),name==='mother'?-26:-16);
}
function killEnemy(i,reward=true){const e=enemies[i],T=ET[e.type];if(T.ground)decals.push({wx:e.x+camX,s:scroll+H-e.y,r:e.bw?Math.min(e.bw,e.bh)*.45:T.r*.9,look:e.look||'city'});enemies.splice(i,1);addFx(e.x,e.y,T.r+4,.4);SFX.boom(T.r>12);

  if(!reward)return;score+=T.score;
  for(let k=0,n=Math.round(T.gold*1.6)+(Math.random()<.3?1:0);k<n;k++){const a=Math.random()*7,v=30+Math.random()*40;coins.push({x:e.x,y:e.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-20,t:0})}}
function updateField(dt){
  if(state==='play'&&scroll<Math.min(BOSS_S,run.end)-150&&enemies.length<14&&(spawnT-=dt)<=0){spawnT=(1.6-.8*scroll/BOSS_S+Math.random()*.3)/((1+.12*lvl)*(run.elite?1.4:1)*(EASY?.75:1));spawnWave()}
  for(let i=enemies.length-1;i>=0;i--){const e=enemies[i],T=ET[e.type];e.t+=dt;e.flash=Math.max(0,e.flash-dt);T.upd(e,dt);
    if(!T.ground&&!ship.dead&&Math.hypot(e.x-hitCX(),e.y-hitCY())<T.r+4*shipHitScale()){hitShip();killEnemy(i,false);continue}
    if(e.t>1&&(e.y>H+30||e.y<-60||e.x<-40||e.x>W+40))enemies.splice(i,1)}
  for(let i=ebul.length-1;i>=0;i--){const b=ebul[i];b.t+=dt;b.x+=b.vx*dt*BSPD;b.y+=b.vy*dt*BSPD;
    if(b.k==='m'&&b.t>1.8){ring(b.x,b.y,8,65,b.t);addFx(b.x,b.y,6,.25);ebul.splice(i,1);continue}
    if(b.k==='s'&&b.t>.9){ring(b.x,b.y,6,70,b.t*3);addFx(b.x,b.y,5,.2);ebul.splice(i,1);continue}
    if(b.k==='w')b.x+=Math.cos(b.t*5+b.ph)*40*dt;
    if(b.k==='c'){const sp=Math.hypot(b.vx,b.vy)||1,ns=Math.min(125,sp+75*dt);b.vx*=ns/sp;b.vy*=ns/sp}   // 얼음 결정: 점점 가속
    if(!ship.dead&&inv<=0&&Math.hypot(b.x-hitCX(),b.y-hitCY())<(b.k==='m'?7.7:6)*shipHitScale()){ebul.splice(i,1);hitShip();if(!ebul.length)break;continue}   // 피격 시 hitShip이 탄 목록을 비움 (무적 중엔 통과) · 탄 판정도 축소(9/7→7.7/6)
    if(b.y>H+10||b.y<-20||b.x<-10||b.x>W+10)ebul.splice(i,1)}
  // 코인 흡수: 매 프레임 기체 쪽으로 직진(속도 점점 증가, 기체를 지나치지 않음) → 기체 주위를 맴돌다 뭉치는 현상 방지
  const canTake=!ship.dead&&state!=='over',take=i=>{gainGold(COIN_V);SFX.coin();coins.splice(i,1)};
  for(let i=coins.length-1;i>=0;i--){const c=coins[i];c.t+=dt;let dx=ship.x-c.x,dy=ship.y-c.y,d=Math.hypot(dx,dy);
    if(canTake&&d<12){take(i);continue}
    if(canTake&&(c.t>.35||c.pull)&&(d<(UP.magnet?95:45)||state==='clear'||c.pull)){c.pull=(c.pull||0)+dt;
      const sp=Math.min(d/dt,240+c.pull*900);c.vx=dx/d*sp;c.vy=dy/d*sp;c.x+=c.vx*dt;c.y+=c.vy*dt;
      if(Math.hypot(ship.x-c.x,ship.y-c.y)<12)take(i);continue}
    c.vx*=1-2*dt;c.vy+=(SPEED*3.2-c.vy)*Math.min(1,dt*2.6);c.x+=c.vx*dt;c.y+=c.vy*dt;if(c.y>H+10)coins.splice(i,1)}   // 흡수 안 되면 아래로 떨어짐 (더 빠르게)
}

    put(e,0,0,e.flash>0?'#fff':null)}

  for(const e of enemies)if(!ET[e.type].ground)draw(e);

  O(b.x,b.y,3.4,EB0);O(b.x,b.y,2.9,EB1);O(b.x,b.y,1.9,EB2)}
// 꽈배기 탄: 같은 경로를 따라 두 가닥이 위상차 180°로 감기며 내려옴 (판정은 중심선)

  mapEl.classList.remove('on');SFX.respawn();lvl=DF()+Math.min(r,ROWS_N-1)*.125;   // 줄마다 +0.125 (보스 직전 +0.5)
  if(n.type==='hangar')return openShop('node');
  if(n.type==='event')return openEvent();
  if(n.type==='boss')return beginFlight(BOSS_S-sec(8),Infinity,false);   // r===BOSS_R
  beginFlight(SEGS[r][0],SEGS[r][1],n.type==='elite')}

// ---------- 지도 배경: 다층 우주 (별 3층 + 성운 + 행성, 커서에 따라 층별로 다르게 움직임) ----------
const STARS=[0,1,2].map(l=>{const r=rng(100+l);return Array.from({length:[70,38,16][l]},()=>[r()*W,r()*H])});
const NEB=[[60,80,95,'120,60,200'],[190,190,115,'40,120,220'],[110,250,80,'200,60,130']];
function drawSpace(now){
  const t=now/1000,px=mouse?(mouse[0]-CX)/CX:0,py=mouse?(mouse[1]-H/2)/(H/2):0;
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#04050d');g.addColorStop(1,'#0c1430');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const [x,y,r,c] of NEB){const ox=x-px*5,oy=mod(y+t*2-py*3,H+2*r)-r,gr=ctx.createRadialGradient(ox,oy,0,ox,oy,r);
    gr.addColorStop(0,`rgba(${c},.22)`);gr.addColorStop(1,`rgba(${c},0)`);ctx.fillStyle=gr;ctx.fillRect(ox-r,oy-r,r*2,r*2)}
  STARS.forEach((S,l)=>{const sp=[4,11,24][l],sz=[1,1,2][l],par=[3,9,18][l];
    ctx.fillStyle=['#4a5a80','#a0b0d8','#ffffff'][l];
    for(const [x,y] of S)ctx.fillRect(mod(x-px*par,W)|0,mod(y+t*sp-py*par*.5,H)|0,sz,sz)});
  // 행성: 화면 아래 거대 구체. 대륙이 천천히 자전하고, 가장 가까운 층이라 커서에 가장 크게 반응
  const cx=CX-px*24,cy=H+(state==='title'?H*.4:H*.469)-py*10,Rr=state==='title'?H*.734:H*.672;
  const at=ctx.createRadialGradient(cx,cy,Rr-4,cx,cy,Rr+22);at.addColorStop(0,`rgba(${TH.pl.atm},.55)`);at.addColorStop(1,`rgba(${TH.pl.atm},0)`);
  ctx.fillStyle=at;ctx.beginPath();ctx.arc(cx,cy,Rr+22,0,7);ctx.fill();
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,Rr,0,7);ctx.clip();
  const sea=ctx.createRadialGradient(cx-70,cy-150,10,cx,cy,Rr);sea.addColorStop(0,TH.pl.sea[0]);sea.addColorStop(1,TH.pl.sea[1]);ctx.fillStyle=sea;ctx.fillRect(cx-Rr,cy-Rr,Rr*2,Rr*2);
  const rot=t*5;
  for(let k=0;k<7;k++){const lx=cx-Rr+mod(k*97+rot,Rr*2+80)-40,ly=cy-Rr+40+hash(k*3.3)*70,lr=18+hash(k*7.1)*26;
    ctx.fillStyle=k%3?TH.pl.land[0]:TH.pl.land[1];ctx.beginPath();ctx.ellipse(lx,ly,lr,lr*.55,hash(k)*2,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.ellipse(lx+lr*.6,ly-6,lr*.5,4,0,0,7);ctx.fill()}   // 구름띠
  const sh=ctx.createLinearGradient(cx-Rr,cy-Rr,cx+Rr*.6,cy+Rr*.2);sh.addColorStop(0,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(0,0,20,.65)');
  ctx.fillStyle=sh;ctx.fillRect(cx-Rr,cy-Rr,Rr*2,Rr*2);ctx.restore()}

// ---------- 저공 구름: 지면보다 카메라에 가까워 더 빠르게 지나가고, 그림자는 지면에 붙어 지면 속도로 흐름 ----------
function drawClouds(){
  const K0=Math.ceil((scroll-120)/150),K1=Math.floor((scroll+H+120)/150),CYc=H/2,list=[];
  for(let k=K0;k<=K1;k++){if(hash(k*1.7)<.35)continue;const G=k*150+hash(k*3.1)*60;
    const sea=Math.max(1-sstep(OPEN_A-sec(6),OPEN_A,G),sstep(CLOSE_B,CLOSE_B+sec(6),G)*(1-sstep(WASTE_S-sec(6),WASTE_S,G))),dust=sstep(WASTE_S,WASTE_S+sec(6),G)*TH.dustA,a=Math.max(sea,dust);if(a<=.01)continue;
    const gx=hash(k*5.3)*(W+80)-40-camX,yg=scroll-G+H,puffs=[];
    for(let i=0;i<6;i++)puffs.push([(hash(k*9+i)-.5)*46,(hash(k*13+i)-.5)*22,9+hash(k*17+i)*14]);
    list.push({a,col:sea>=dust?'255,255,255':TH.dustC,gx,yg,xc:CX+(gx-CX)*1.35,yc:CYc+(yg-CYc)*1.35,puffs})}
  const blob=(x,y,P,s)=>{ctx.beginPath();for(const [dx,dy,r] of P){ctx.moveTo(x+dx*s+r*s,y+dy*s);ctx.ellipse(x+dx*s,y+dy*s,r*s,r*.8*s,0,0,7)}ctx.fill()};
  for(const c of list){ctx.fillStyle=`rgba(0,0,0,${.16*c.a})`;blob(c.gx+16,c.yg+24,c.puffs,1)}             // 지면 그림자
  for(const c of list){ctx.fillStyle=`rgba(${c.col},${.5*c.a})`;blob(c.xc,c.yc,c.puffs,1.35);               // 구름 본체(크게 = 가까움)
    ctx.fillStyle=`rgba(255,255,255,${.3*c.a})`;blob(c.xc-4,c.yc-5,c.puffs.slice(0,4),.95)}}

// ---------- 빙하 입체 연출: 빙산·세락(돌출 기둥), 3층 눈보라 ----------
function polyAt(pts,x,y,s=1){ctx.beginPath();pts.forEach(([px,py],i)=>i?ctx.lineTo(x+px*s,y+py*s):ctx.moveTo(x+px*s,y+py*s));ctx.closePath();ctx.fill()}
// 위에서 내려다보는 카메라 기준: 높은 물체일수록 윗면이 화면 중심에서 바깥으로 밀려나 옆면이 드러남
function drawPrism(x,y,pts,h,cBase,cTop,water,PP={}){
  const k=h*.012,dx=(x-CX)*k,dy=(y-H*.55)*k;
  if(water){ctx.fillStyle=water;polyAt(pts,x,y,1.3)}             // 물속에 잠긴 부분
  ctx.fillStyle='rgba(0,12,35,.32)';polyAt(pts,x+h*.5,y+h*.75);                     // 그림자
  const N=Math.max(3,Math.round(h/2.5));for(let i=0;i<N;i++){const t=i/N;ctx.fillStyle=lerpRGB(cBase,cTop,t);polyAt(pts,x+dx*t,y+dy*t)}   // 옆면(층층이 쌓기)
  ctx.fillStyle=PP.top||'#f2f9ff';polyAt(pts,x+dx,y+dy);                           // 윗면
  ctx.fillStyle=PP.hi||'rgba(255,255,255,.75)';polyAt(pts.map(([a,b])=>[a*.5-1.5,b*.5-1.5]),x+dx,y+dy);
  if(PP.glow)GL(x+dx,y+dy,10,PP.glow)}
function drawIceProps(){const STEP=52,K0=Math.ceil((scroll-60)/STEP),K1=Math.floor((scroll+H+60)/STEP);
  for(let k=K1;k>=K0;k--){const G=k*STEP+hash(k*4.1)*26;
    const se=TH.seaEnd??sec(22),sea=G<se-20,shelf=(G>se+sec(2)&&G<OPEN_A-sec(3))||(G>CLOSE_B+sec(2)&&G<WASTE_S-sec(2)),field=G>WASTE_S+sec(3);if(!(sea||shelf||field))continue;
    const PP=(TH.pp||{})[sea?'sea':shelf?'land':'field'];if(!PP)continue;
    for(let j=0;j<2;j++){const hk=k*7.13+j*3.7;if(hash(hk)<(sea?.45:.6))continue;
      const x=hash(hk*1.9)*(W+80)-40-camX,y=scroll-G+H+(j?hash(hk*2.2)*24:0);if(y<-50||y>H+50)continue;
      const R=PP.r[0]+hash(hk*3.3)*PP.r[1],h=PP.h[0]+hash(hk*5.5)*PP.h[1],n=PP.n||6+(hash(hk*6.6)*3|0),pts=[],sq=PP.n?1:.65;
      for(let v=0;v<n;v++){const a=v/n*TAU+(PP.n?Math.PI/n:0),rr=R*(sq+(1-sq)*hash(hk*9+v));pts.push([Math.cos(a)*rr,Math.sin(a)*rr*.85])}
      drawPrism(x,y,pts,h,PP.c[0],PP.c[1],PP.halo,PP)}}}
// 눈보라 3층: 먼 층(작고 느림) → 가까운 층(크고 빠름, 기체보다 앞에 그림)
const SNOWL=[46,28,12].map((n,l)=>{const r=rng(300+l);return Array.from({length:n},()=>[r()*W,r()*H,r()*TAU])});
function drawSnow(l,now){const t=now/1000,up=TH.partUp?-.55:1,sp=[46,72,128][l]*up,par=[.25,.5,1][l],sz=[1,1.6,2.6][l],wind=[5,9,15][l];
  ctx.fillStyle=`rgba(${TH.partC||'255,255,255'},${[.55,.75,.9][l]})`;
  for(const [x0,y0,ph] of SNOWL[l]){const x=mod(x0+Math.sin(t*1.2+ph)*6+t*wind-camX*par,W+10)-5,y=mod(y0+t*sp,H+10)-5;
    if(sz<2)ctx.fillRect(x|0,y|0,sz>1?2:1,sz>1?2:1);else{ctx.beginPath();ctx.arc(x,y,sz*.5+.6,0,7);ctx.fill()}}}
function drawFrost(w,now){const r=w.r,g=ctx.createRadialGradient(w.x,w.y,0,w.x,w.y,r+4);g.addColorStop(0,'rgba(230,248,255,.85)');g.addColorStop(1,'rgba(150,210,255,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(w.x,w.y,r+4,0,7);ctx.fill();
  ctx.save();ctx.translate(w.x,w.y);ctx.rotate(w.rot);ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.beginPath();
  for(let k=0;k<6;k++){const a=k*Math.PI/3;ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*r*.8,Math.sin(a)*r*.8);ctx.moveTo(Math.cos(a)*r*.45,Math.sin(a)*r*.45);ctx.lineTo(Math.cos(a+.5)*r*.62,Math.sin(a+.5)*r*.62)}
  ctx.stroke();ctx.restore()}
let slowK='web',frozen=0,frozeAt=null;const shards=[];   // slow: 화력 약화(거미줄·서리 후유증), frozen: 결빙(이동·사격 정지)

// ---------- 보스: 빙룡 크라이오스 (몸통 14마디가 머리를 따라오는 사슬 구조) ----------
const DR={N:14,gap:9},drRad=i=>Math.max(4,11.5-i*.55);
function makeDragon(){const hp=Math.round(BOSS_HP*1.15*(1+.35*DF()));
  const b={kind:'dragon',x:CX,y:-80,t:0,hp,maxHp:hp,flash:0,dead:0,mouth:0,breathT:2.6,breath:0,bAng:Math.PI/2,bT:0,ringT:4.2,orbT:5,spT:6,sp:0,spA:0,spD:0,segs:[]};
  for(let i=0;i<DR.N;i++)b.segs.push([CX,-80-i*DR.gap]);return b}
function updDragon(b,dt){
  b.t+=dt;b.flash=Math.max(0,b.flash-dt);b.mouth=Math.max(0,b.mouth-dt*2.5);const p2=b.hp<b.maxHp/2;
  if(!b.dead){if(b.t<3){b.y=-80+180*sstep(0,1,b.t/3);b.x=CX+25*Math.sin(b.t*2.2)}
    else{const t=b.t-3,s=p2?1.35:1;b.x=CX+78*Math.sin(t*.55*s);b.y=92+42*Math.sin(t*1.1*s+.6)}}
  else b.y+=12*dt;
  const S=b.segs;S[0][0]=b.x;S[0][1]=b.y;
  for(let i=1;i<S.length;i++){const p=S[i-1],q=S[i];q[1]-=18*dt;const dx=q[0]-p[0],dy=q[1]-p[1],d=Math.hypot(dx,dy)||1;q[0]=p[0]+dx/d*DR.gap;q[1]=p[1]+dy/d*DR.gap}
  if(b.dead||b.t<3.2)return;
  for(let i=2;i<S.length;i++)if(Math.hypot(S[i][0]-ship.x,S[i][1]-ship.y)<drRad(i)+2){hitShip();break}   // 몸통 접촉
  // 얼음 숨결: 플레이어를 천천히 쫓는 얼음 파편 분사
  if((b.breathT-=dt)<=0){b.breathT=p2?2.2:3;b.breath=p2?1.5:1.1;b.bAng=aimA(b.x,b.y);SFX.breath()}
  if(b.breath>0){b.breath-=dt;b.mouth=1;const da=mod(aimA(b.x,b.y)-b.bAng+Math.PI,TAU)-Math.PI;b.bAng+=Math.max(-.6*dt,Math.min(.6*dt,da));
    if((b.bT-=dt)<=0){b.bT=.04;for(let k=0;k<(p2?3:2);k++){const a=b.bAng+(Math.random()-.5)*.8,v=105+Math.random()*35;
      ebul.push({x:b.x+Math.cos(b.bAng)*13,y:b.y+Math.sin(b.bAng)*13,vx:Math.cos(a)*v,vy:Math.sin(a)*v,k:'f',t:0})}}}
  // 얼음 결정 고리: 몸통에서 퍼지며 점점 가속
  if((b.ringT-=dt)<=0){b.ringT=p2?2.8:4;const s=S[6],N=p2?26:20,aimAng=aimA(s[0],s[1]),gapRad=p2?.85:1.05;
    for(let i=0;i<N;i++){const a=i*TAU/N+b.t,da=Math.abs(mod(a-aimAng+Math.PI,TAU)-Math.PI);if(da<gapRad/2)continue;
      ebul.push({x:s[0],y:s[1],vx:Math.cos(a)*28,vy:Math.sin(a)*28,k:'c',t:0})}SFX.eshot()}
  // 2페이즈: 서리 구체(감속)
  if(p2&&(b.orbT-=dt)<=0){b.orbT=3.2;for(const o of[-.6,0,.6]){const a=aimA(b.x,b.y)+o;webs.push({x:b.x,y:b.y,vx:Math.cos(a)*62,vy:Math.sin(a)*62,t:0,r:3,rot:0,k:'frost'})}SFX.web()}
  // 새 패턴: 꼬리 회전 나선 (꼬리 끝에서 3갈래로 돌며 뿜음)
  if((b.spT-=dt)<=0){b.spT=p2?4.5:6.5;b.sp=p2?2.4:1.8;b.spA=Math.random()*TAU;b.spD=0}
  if(b.sp>0){b.sp-=dt;b.spA+=dt*3.2;if((b.spD-=dt)<=0){b.spD=.11;const L=S[S.length-1];for(let k=0;k<3;k++)shoot(L[0],L[1],b.spA+k*TAU/3,70)}}
}
function hitDragon(b,x,y){if(Math.hypot(x-b.x,y-b.y)<15)return true;for(let i=1;i<b.segs.length;i++)if(Math.hypot(x-b.segs[i][0],y-b.segs[i][1])<drRad(i)+2)return true;return false}
function drawDragon(b,now){
  const S=b.segs,p2=b.hp<b.maxHp/2,fl=Math.sin(now/170)*(b.dead?.3:1);
  const ang=i=>{const a=S[Math.max(0,i-1)],c=S[Math.min(S.length-1,i+1)];return Math.atan2(a[1]-c[1],a[0]-c[0])};   // 머리 쪽 방향
  const wings=(ox,oy,shadow)=>{ctx.save();ctx.translate(S[2][0]+ox,S[2][1]+oy);ctx.rotate(ang(2)+Math.PI/2);
    for(const s of[-1,1]){const sp=.72+.28*fl,P=[[0,-2],[s*12,-14*sp],[s*34*sp,-18*sp],[s*46*sp,-4],[s*36*sp,9],[s*24*sp,4],[s*15,13],[s*5,8]];
      ctx.fillStyle=shadow?'rgba(0,12,35,.25)':'rgba(150,215,255,.5)';polyAt(P,0,0);
      if(!shadow){ctx.strokeStyle='rgba(225,245,255,.85)';ctx.lineWidth=1;ctx.beginPath();for(const k of[2,3,4,5]){ctx.moveTo(0,-2);ctx.lineTo(P[k][0],P[k][1])}ctx.stroke();
        ctx.strokeStyle='#2a5a90';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,-2);for(const k of[1,2,3])ctx.lineTo(P[k][0],P[k][1]);ctx.stroke()}}
    ctx.restore()};
  // 그림자 (높이 떠 있으므로 멀리 떨어짐)
  wings(13,22,1);ctx.fillStyle='rgba(0,12,35,.3)';for(let i=S.length-1;i>=0;i--){ctx.beginPath();ctx.arc(S[i][0]+13,S[i][1]+22,i?drRad(i):12,0,7);ctx.fill()}
  GL(b.x,b.y,30,`rgba(160,220,255,${.18+.1*pulse(now)})`);
  wings(0,0,0);
  // 꼬리 지느러미
  {const L=S[S.length-1],a=ang(S.length-1)+Math.PI;ctx.fillStyle='#c8eeff';
    polyAt([[Math.cos(a)*12,Math.sin(a)*12],[Math.cos(a+1.9)*7,Math.sin(a+1.9)*7],[Math.cos(a-1.9)*7,Math.sin(a-1.9)*7]],L[0],L[1])}
  // 몸통 마디
  for(let i=S.length-1;i>=1;i--){const [x,y]=S[i],r=drRad(i),a=ang(i);
    ctx.fillStyle='#0a1a38';ctx.beginPath();ctx.arc(x,y,r+1.3,0,7);ctx.fill();
    ctx.fillStyle=lerpRGB([140,205,245],[60,120,190],i/S.length);ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(x-r*.3,y-r*.3,r*.45,0,7);ctx.fill();
    ctx.fillStyle='#e8f8ff';polyAt([[Math.cos(a)*r*.9,Math.sin(a)*r*.9],[Math.cos(a+2.6)*r*.5,Math.sin(a+2.6)*r*.5],[Math.cos(a-2.6)*r*.5,Math.sin(a-2.6)*r*.5]],x,y)}   // 등 가시
  // 머리
  const ha=Math.atan2(S[0][1]-S[1][1],S[0][0]-S[1][0]),m=b.mouth;
  ctx.save();ctx.translate(S[0][0],S[0][1]);ctx.rotate(ha);
  if(b.breath>0){const g=ctx.createRadialGradient(18,0,0,18,0,16);g.addColorStop(0,'rgba(220,245,255,.85)');g.addColorStop(1,'rgba(150,210,255,0)');ctx.fillStyle=g;ctx.fillRect(2,-16,32,32)}
  ctx.strokeStyle='#e8f8ff';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-3,-5);ctx.lineTo(-17,-12);ctx.moveTo(-3,5);ctx.lineTo(-17,12);ctx.stroke();   // 뿔
  for(const s of[-1,1]){ctx.fillStyle='#0a1a38';polyAt([[2,s*1],[17,s*(4+m*6)],[13,s*(8+m*3)],[0,s*7]],0,0);ctx.fillStyle='#7ab8e8';polyAt([[3,s*1.5],[15,s*(4.5+m*5.5)],[12,s*(7+m*3)],[1,s*6]],0,0)}   // 턱
  ctx.fillStyle='#0a1a38';ctx.beginPath();ctx.ellipse(2,0,13,9,0,0,7);ctx.fill();
  ctx.fillStyle='#9ad4f8';ctx.beginPath();ctx.ellipse(2,0,12,8,0,0,7);ctx.fill();
  ctx.fillStyle='#c8ecff';ctx.beginPath();ctx.ellipse(8,0,6,4.5,0,0,7);ctx.fill();
  const ec=p2?'#ff4060':'#40f0ff';GL(4,-4.5,5,p2?'rgba(255,60,90,.6)':'rgba(60,240,255,.6)');GL(4,4.5,5,p2?'rgba(255,60,90,.6)':'rgba(60,240,255,.6)');
  ctx.fillStyle=ec;ctx.beginPath();ctx.arc(4,-4.5,1.8,0,7);ctx.arc(4,4.5,1.8,0,7);ctx.fill();
  ctx.restore();
  if(b.flash>0){ctx.fillStyle='rgba(255,255,255,.6)';for(let i=0;i<S.length;i++){ctx.beginPath();ctx.arc(S[i][0],S[i][1],i?drRad(i):12,0,7);ctx.fill()}}}

function heroShip(x,y,s,bank,now,flame=true){const g=ctx,r=Math.max(-1,Math.min(1,bank||0));
  if(Math.abs(r)<.02){g.save();g.translate(x,y);g.scale(s,s);shipBody(g,now,flame,0);g.restore();return}
  for(const side of[-1,1]){const far=side*r>0,k=far?1-Math.abs(r)*.38:1+Math.abs(r)*.06;   // 기수는 항상 위, 좌우 폭만 바뀜
    g.save();g.translate(x,y);g.beginPath();g.rect(side<0?-60*s:0,-60*s,60*s,140*s);g.clip();g.scale(s*k,s);shipBody(g,now,flame,r);
    g.fillStyle=far?`rgba(0,8,30,${.42*Math.abs(r)})`:`rgba(190,220,255,${.12*Math.abs(r)})`;   // 먼 날개 어둡게 · 가까운 날개 밝게
    g.beginPath();[[0,-14],[10,-2],[30,14],[46,18],[46,26],[36,26],[22,24],[12,30],[0,32]].forEach(([a,b],i)=>i?g.lineTo(side*a,b):g.moveTo(side*a,b));g.closePath();g.fill();g.restore()}}
function shipBody(g,now,flame,r){const t=now/1000,T2=Math.PI*2;g.save();
  // 가디언 크레스트(흰색+레드): 지붕형 노즈 + 방패형 날개 + 상단 센서 + 패널 라인. ship_redesign3.html 'B' 디자인을 게임 좌표계(1.84배)로 이식
  const SC=1.84;g.scale(SC,SC);
  const lin=(x0,y0,x1,y1,st)=>{const q=g.createLinearGradient(x0,y0,x1,y1);st.forEach(([o,c])=>q.addColorStop(o,c));return q};
  const P=(pts,fill,stroke,lw)=>{g.beginPath();pts.forEach(([a,b],i)=>i?g.lineTo(a,b):g.moveTo(a,b));g.closePath();if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||.6;g.stroke()}};
  const M=pts=>pts.concat(pts.slice().reverse().map(([a,b])=>[-a,b]));   // 좌우 대칭 외곽
  const pulse=.5+.5*Math.sin(t*6);

    for(const sx of[-8,0,8]){const L=16+Math.sin(t*38+sx)*3+Math.sin(t*13)*1.8,wide=2.4;
      g.fillStyle=lin(sx,26,sx,26+L,[[0,'rgba(255,255,255,1)'],[.2,'rgba(255,210,160,.95)'],[.55,'rgba(255,110,70,.55)'],[1,'rgba(255,70,40,0)']]);
      g.beginPath();g.moveTo(sx-wide,26);g.quadraticCurveTo(sx,26+L*1.2,sx+wide,26);g.fill();
      const rg=g.createRadialGradient(sx,27,0,sx,27,wide*3);rg.addColorStop(0,'rgba(255,170,110,.6)');rg.addColorStop(1,'rgba(255,70,40,0)');g.fillStyle=rg;g.fillRect(sx-wide*3,27-wide*2,wide*6,wide*6)}

  P(M([[0,-2],[8,4],[18,10],[24,18],[22,23],[14,20],[6,12],[2,4]]),
    lin(-24,0,24,0,[[0,WHITE_D],[.3,WHITE],[.5,'#ffffff'],[.7,WHITE],[1,WHITE_D]]),'rgba(40,44,50,.5)',.5);

  // 날개 레드 삼각 패널(포인트 무늬)

  g.save();g.strokeStyle='rgba(120,128,138,.55)';g.lineWidth=.35;

    g.beginPath();g.moveTo(s*10,6);g.lineTo(s*18,21);g.stroke();
    g.beginPath();g.moveTo(s*6,10);g.lineTo(s*13,19.5);g.stroke();}
  g.restore();
  // 짧고 뭉툭한 지붕형 노즈 - 흰색 베이스
  P(M([[0,-18],[3,-14],[4.6,-4],[4.4,8],[3.2,16],[1.8,21]]),
    lin(-4.6,0,4.6,0,[[0,WHITE_D],[.3,WHITE],[.5,'#ffffff'],[.7,WHITE],[1,WHITE_D]]),'rgba(40,44,50,.5)',.5);
  P([[0,-18],[3,-15],[0,-11],[-3,-15]],RED);   // 지붕형 노즈 끝 레드 포인트
  // 동체 중앙 패널 라인
  g.save();g.strokeStyle='rgba(120,128,138,.6)';g.lineWidth=.35;g.beginPath();
  g.moveTo(-2.6,-8);g.lineTo(-2,19);g.moveTo(2.6,-8);g.lineTo(2,19);g.stroke();
  g.beginPath();g.moveTo(0,-14);g.lineTo(0,19);g.stroke();g.restore();
  // 동체 레드 스트라이프
  g.fillStyle=RED;g.fillRect(-.6,0,1.2,16);
  // 상단 둥근 센서
  g.fillStyle='#2a2e34';g.beginPath();g.ellipse(0,-9,2.4,2.4,0,0,T2);g.fill();
  g.fillStyle=CANOPY;g.beginPath();g.ellipse(0,-9,1.6,1.6,0,0,T2);g.fill();
  // 조종석 캐노피 (bank 시 좌우로 살짝 이동)
  g.translate(r*2/SC,0);
  {const p=.5+.5*Math.sin(t*6*1000/300*0+now/300);g.save();g.shadowColor='rgba(168,232,245,.8)';g.shadowBlur=3+2*p;
    const q=g.createRadialGradient(-.6,-1.5,0,0,0,2.2);q.addColorStop(0,'#e8fbff');q.addColorStop(.5,CANOPY);q.addColorStop(1,'#2a5868');

    g.strokeStyle='#14222a';g.lineWidth=.3;g.beginPath();g.ellipse(0,0,2.2,4.5,0,0,T2);g.stroke();g.restore()}
  g.translate(-r*2/SC,0);
  // 엔진 포드 (좌우)
  for(const sx of[-8,8]){
    g.fillStyle='#1a1e24';g.beginPath();g.ellipse(sx,24,2.6,3.4,0,0,T2);g.fill();
    g.fillStyle='#5c636e';g.beginPath();g.ellipse(sx,23.2,2.1,1.8,0,0,T2);g.fill();
    g.fillStyle=flame?`rgba(255,220,190,${.7+.25*pulse})`:'#3a3e48';g.beginPath();g.ellipse(sx,25.3,1.4,.9,0,0,T2);g.fill();
  }

  g.save();g.globalCompositeOperation='lighter';
  {const q=g.createRadialGradient(0,-16,0,0,-16,2.8);q.addColorStop(0,`rgba(255,160,60,${.8*pulse+.2})`);q.addColorStop(1,'rgba(255,120,40,0)');g.fillStyle=q;g.fillRect(-3.5,-19,7,7)}
  if((now/400|0)%2)for(const [sx,c] of[[-16,'255,64,80'],[16,'64,255,128']]){const q=g.createRadialGradient(sx,10,0,sx,10,3);q.addColorStop(0,`rgba(${c},1)`);q.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=q;g.fillRect(sx-3,7,6,6)}
  g.restore();
  g.restore()}

function drawGirders(){if(!TH.girders||TH.space)return;const f=1.55,STEP=110,s0=scroll*f,K0=Math.ceil((s0-40)/STEP),K1=Math.floor((s0+H+40)/STEP);

    ctx.fillStyle='#14181e';ctx.fillRect(0,y,W,6);ctx.fillStyle='#3a414c';ctx.fillRect(0,y,W,1);
    ctx.fillStyle='#1e2228';for(let x=mod(ox,24)-24;x<W;x+=24){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+12,y+6);ctx.lineTo(x+14,y+6);ctx.lineTo(x+2,y);ctx.fill()}

  for(let k=K0;k<=K1;k++){const hk=k*7.7+l*31;if(hash(hk)<[.3,.45,.6][l])continue;const y=s0-k*STEP-hash(hk*2)*STEP*.5+H;
    let x=hash(hk*3)*(W+60)-30;if(l===2)x=hash(hk*5)<.5?hash(hk*3)*W*.28:W-hash(hk*3)*W*.28;x-=camX*f;   // 가장 가까운 층은 화면 양옆에만 (시야 확보)
    const R=[4,10,24][l]+hash(hk*4)*[5,9,16][l],rot=scroll*.004*(hash(hk*6)-.5)+k;

  e.preventDefault()});

  if(canSteer()){ship.x+=x-touch.x;ship.y+=y-touch.y;clampShip()}
  touch.x=x;touch.y=y;e.preventDefault()});

addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='p'||e.key==='P')setMenu(!menuOpen);if(e.key==='m'||e.key==='M'){VOL.mute=!VOL.mute;saveVol()}});

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000)||.016;last=now;stT+=dt;bgmTick();
  document.body.classList.toggle('full',state==='title'||state==='howto'||state==='map'||state==='event'||state==='ending');
  document.body.classList.toggle('shopOpen',state==='shop');
  if(state==='title'){if(cv.style.cursor!=='default')cv.style.cursor='default';hiDraw(()=>{drawSpace(now);drawTitle(now)});return requestAnimationFrame(frame)}
  if(state==='howto'){if(cv.style.cursor!=='default')cv.style.cursor='default';hiDraw(()=>{drawSpace(now);drawHowTo(now)});return requestAnimationFrame(frame)}
  // ----- 업데이트 -----
  const slowF=1,alive=!ship.dead&&state!=='over';
  if(ship.dead>0&&state!=='over'){ship.dead-=dt;if(ship.dead<=0){ship.dead=0;ship.x=ship.tx=CX;ship.y=H+20;ship.ty=SHIP_Y;inv=2.5;ship.enter=1;SFX.respawn()}}
  if(ship.enter){ship.y-=120*dt;if(ship.y<=SHIP_Y){ship.y=SHIP_Y;ship.enter=0}}
  if(menuOpen)return requestAnimationFrame(frame);   // 메뉴가 열려 있으면 일시정지   // 재출격 연출: 아래에서 올라옴
  if(alive&&!ship.enter){
    const sp=frozen?0:90*dt*slowF;
    if(keys.ArrowLeft||keys.a)ship.x-=sp;if(keys.ArrowRight||keys.d)ship.x+=sp;
    if(keys.ArrowUp||keys.w)ship.y-=sp;if(keys.ArrowDown||keys.s)ship.y+=sp;
    if(mouse&&!ship.dead&&!frozen){ship.x=mouse[0];ship.y=mouse[1]}   // 커서가 멈춰 있어도 위치 유지(재출격 직후 등)
  }
  if(!ship.enter)ship.x=Math.max(10,Math.min(W-10,ship.x)),ship.y=Math.max(20,Math.min(H-14,ship.y));
  {const vx=(ship.x-(ship.px??ship.x))/dt;ship.px=ship.x;   // 좌우 이동 → 기울기(뱅크)
   ship.bank=(ship.bank||0)+(Math.max(-1,Math.min(1,vx/80))-(ship.bank||0))*Math.min(1,dt*10)}
  if(state!=='shop'&&state!=='map'&&state!=='event'&&state!=='ending')scroll+=SPEED*mult*dt;camX=(ship.x-CX)*.3;inv=Math.max(0,inv-dt);slow=Math.max(0,slow-dt);flashT=Math.max(0,flashT-dt);
  if(state==='play'&&scroll>=run.end){state='segclear';stT=0;bgmStop();SFX.clear();for(const c of coins)gainGold(COIN_V);coins.length=0;
    run.bonus=(run.mode==='treasure'?0:40+20*(stage-1))+(run.elite?80:0)+(noDmg?40:0)+(EASY&&run.pos.r===0&&run.mode!=='treasure'?80:0);gold+=run.bonus}   // 마지막 항: 섹터 1 첫 전투 보너스
  if(state==='segclear'&&stT>2.6)openMap();
  if(state==='play'&&scroll>=BOSS_S){state='warning';stT=0;bgmStop();SFX.warn()}
  if(state==='warning'&&stT>2.5){state='boss';stT=0;boss=BOSSES[TH.boss].make();bgmPlay('boss_'+TH.boss);if(isFinal)SFX.warn()}
  if(boss)BOSSES[boss.kind].upd(boss,dt);
  updateField(dt);
  if(state==='dying'){
    if((boss.dieT=(boss.dieT||0)-dt)<=0){boss.dieT=.08;SFX.boom(false);addFx(boss.x+(Math.random()-.5)*70,boss.y-14+(Math.random()-.5)*70,8+Math.random()*10,.5)}
    if(stT>2.4){for(let k=0;k<12;k++)addFx(boss.x+(Math.random()-.5)*60,boss.y-14+(Math.random()-.5)*60,18,.8);
      boss=null;state='clear';stT=0;score+=5000;flashT=.35;bgmStop();SFX.boom(true);SFX.clear()}
  }
  if(state==='clear'&&stT>3.5){if(DEV.boss){DEV.boss=false;toTitle()}else if(isFinal)openEnding();else openShop('boss')}
  if(state==='over'&&stT>8)toTitle();

  if(frozen>0){frozen-=dt;if(frozeAt){ship.x=frozeAt[0];ship.y=frozeAt[1]}
    if(frozen<=0||ship.dead){frozen=0;frozeAt=null;SFX.shatter();for(let k=0;k<10;k++){const a=k/10*TAU;shards.push({x:ship.x,y:ship.y,vx:Math.cos(a)*(60+Math.random()*50),vy:Math.sin(a)*(60+Math.random()*50),t:0,r:Math.random()*TAU})}}}
  for(let i=shards.length-1;i>=0;i--){const q=shards[i];q.t+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=60*dt;q.r+=dt*8;if(q.t>.5)shards.splice(i,1)}
  const combat=alive&&(state==='play'||state==='warning'||state==='boss'||state==='dying'||state==='segclear');
  const weak=slow>0;   // 화력 약화: 연사 50%, 주포만 (확산·후방·옵션·유도 정지)
  if(combat&&!frozen&&(fireT-=dt*(weak?.5:1))<=0){fireT=Math.max(0,fireT+.075*Math.pow(.85,UP.rapid));firePlayer(weak)}
  if(combat)updateWeapons(dt);   // 남은 시간 이월 → 프레임 단위 손실 없음
  for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;let hit=b.y<-10||b.y>H+10||b.x<-10||b.x>W+10;
    if(!hit)for(let j=enemies.length-1;j>=0;j--){const e=enemies[j];
      if(e.y>-4&&!(b.hits&&b.hits.has(e))&&(e.bw?Math.abs(e.x-b.x)<e.bw/2+1&&Math.abs(e.y-b.y)<e.bh/2+1:Math.hypot(e.x-b.x,e.y-b.y)<ET[e.type].r+2)){e.hp-=b.dmg;e.flash=.05;score+=5;SFX.hit();if(e.hp<=0)killEnemy(j);
        if(b.pierce>0){b.pierce--;(b.hits=b.hits||new Set).add(e)}else hit=true;break}}
    if(!hit)for(let j=missiles.length-1;j>=0;j--){const m=missiles[j];
      if(Math.abs(m.x-b.x)<5&&Math.abs(m.y-b.y)<7){missiles.splice(j,1);addFx(m.x,m.y,8,.35);score+=50;SFX.boom(false);hit=true;break}}
    if(!hit&&boss&&state==='boss'&&boss.t>3&&BOSSES[boss.kind].hit(boss,b.x,b.y)){
      hit=true;boss.hp-=b.dmg;boss.flash=.05;SFX.hit();score+=10;addFx(b.x,b.y,3,.15);
      if(boss.hp<=0){state='dying';stT=0;boss.dead=1;missiles.length=webs.length=0}}
    if(hit)bullets.splice(i,1)}
  for(let i=missiles.length-1;i>=0;i--){const m=missiles[i];m.t+=dt;
    if(m.t>.35){const ta=Math.atan2(ship.y-m.y,ship.x-m.x),da=mod(ta-m.a+Math.PI,Math.PI*2)-Math.PI;m.a+=Math.max(-2.4*dt,Math.min(2.4*dt,da))}
    m.v=Math.min(130,m.v+110*dt);m.x+=Math.cos(m.a)*m.v*dt;m.y+=Math.sin(m.a)*m.v*dt;
    if((m.sm+=dt)>.03){m.sm=0;smoke.push({x:m.x-Math.cos(m.a)*4,y:m.y-Math.sin(m.a)*4,t:0})}
    if(!ship.dead&&Math.hypot(m.x-hitCX(),m.y-hitCY())<SHIP_HIT_BASE_R*shipHitScale()){missiles.splice(i,1);addFx(m.x,m.y,10,.4);hitShip();if(!missiles.length)break;continue}
    if(m.t>5||m.y>H+20||m.x<-20||m.x>W+20)missiles.splice(i,1)}
  for(let i=webs.length-1;i>=0;i--){const w=webs[i];w.t+=dt;w.x+=w.vx*dt;w.y+=w.vy*dt;w.r=Math.min(13,3+w.t*9);w.rot+=dt*1.5;
    if(!ship.dead&&Math.hypot(w.x-ship.x,w.y-ship.y)<w.r*.7+3){if(w.k==='frost'){frozen=1;frozeAt=[ship.x,ship.y];slow=1.6;slowK='frost';SFX.freeze()}else{slow=2.2;slowK='web';SFX.web()}webs.splice(i,1);continue}
    if(w.y>H+20||w.x<-20||w.x>W+20)webs.splice(i,1)}
  for(let i=smoke.length-1;i>=0;i--){const s=smoke[i];s.t+=dt;s.y+=SPEED*mult*dt*.5;if(s.t>.6)smoke.splice(i,1)}
  for(let i=fx.length-1;i>=0;i--){fx[i].t+=dt;if(fx[i].t>fx[i].life)fx.splice(i,1)}

  // ----- 렌더 -----
  if(state==='map'||state==='event'){hiDraw(()=>drawSpace(now));return requestAnimationFrame(frame)}
  if(state==='ending'){hiDraw(()=>{drawSpace(now);drawFireworks(now)});return requestAnimationFrame(frame)}
  {const cur=state==='over'?'default':'none';if(cv.style.cursor!==cur)cv.style.cursor=cur}
  if(IS_MOBILE_UA){ctx.save();ctx.translate(CX,H*.5);ctx.scale(1.25,1.25);ctx.translate(-CX,-H*.5)}   // 모바일 전용 배경 줌 (적/탄/기체는 영향 없음, 아래서 restore)
  if(TH.space){drawOrbit(now)}else{
  ctx.fillStyle=TH.abyss;ctx.fillRect(0,0,W,H);                        // 맨 아래: 암흑
  if(TH.abyssTex){ctx.globalAlpha=.85;fillPat(TH.abyssTex,-camX*.4,scroll*.4,[()=>ctx.rect(0,0,W,H)]);ctx.globalAlpha=1}   // 협곡 바닥 (용암·반응로)
  if(TH.deep){const gx=CX-camX*.4,g=ctx.createRadialGradient(gx,H*.5,8,gx,H*.5,150);g.addColorStop(0,`rgba(${TH.deepC||'60,170,255'},${TH.lava?.42+.12*Math.sin(now/300):.32})`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}   // 깊은 곳에서 올라오는 빛
  for(let y=0;y<H;y+=8){const a=1-depthAt(scroll+H-y-4);if(a<=0)continue;   // 얕아지는 구간: 바닥이 황무지로 올라옴
    ctx.globalAlpha=a;fillPat(TH.floor,-camX,scroll,[()=>ctx.rect(0,y,W,8)])}
  ctx.globalAlpha=1;
  if(!TH.space){const P=computeLayers(camX);for(let i=LAYERS.length-1;i>=0;i--)drawLayer(i,P,camX)}
  }
  if(TH.props)drawIceProps();
  drawGirders();
  if(TH.snow){drawSnow(0,now);drawSnow(1,now)}

  if(!TH.noCloud&&!TH.space)drawClouds();
  if(IS_MOBILE_UA)ctx.restore();   // 배경 줌 해제 — 이후 적/탄/보스/기체는 원래 좌표·크기로 그려짐
  drawEnemies(now);
  for(const s of smoke){ctx.fillStyle=`rgba(200,200,200,${.5*(1-s.t/.6)})`;ctx.beginPath();ctx.arc(s.x,s.y,1.5+s.t*4,0,7);ctx.fill()}
  if(boss)BOSSES[boss.kind].draw(boss,now);
  for(const w of webs)w.k==='frost'?drawFrost(w,now):drawWeb(w.x,w.y,w.r,w.rot,.9);
  for(const m of missiles){ctx.save();ctx.translate(m.x,m.y);ctx.rotate(m.a);
    ctx.fillStyle=(now/40|0)%2?'#ffd040':'#ff7020';ctx.fillRect(-6,-1,3,2);
    ctx.fillStyle='#d0d0d8';ctx.fillRect(-3,-1.5,6,3);ctx.fillStyle='#e03030';ctx.fillRect(3,-1,2,2);ctx.restore()}
  for(const b of bullets){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.atan2(b.vy,b.vx));ctx.scale(1.4,1.4);ctx.drawImage(BUL,-11,-4);ctx.restore()}
  shipVis=state!=='over'&&!ship.dead&&!(inv>0&&(now/80|0)%2);if(shipVis)drawShipShadow(ship.x,ship.y,ship.bank||0);   // 기체 본체는 고해상도 층에
  drawWeapons(now);
  drawEbulCoins(now);
  if(slow>0&&!frozen&&state!=='over'&&!ship.dead)slowK==='frost'?drawFrost({x:ship.x,y:ship.y,r:9,rot:now/300},now):drawWeb(ship.x|0,ship.y|0,10,now/300,.8);
  for(const q of shards){ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.r);ctx.globalAlpha=1-q.t/.5;PG([[0,-3],[2,0],[0,3],[-1.5,0]],'#d8f4ff');ctx.restore()}ctx.globalAlpha=1;
  for(const e of fx){if(e.t<0)continue;const k=e.t/e.life;
    ctx.fillStyle=`rgba(255,${200-150*k|0},60,${1-k})`;ctx.beginPath();ctx.arc(e.x,e.y,e.r*(.3+.9*k),0,7);ctx.fill();
    if(k<.3){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(e.x,e.y,e.r*.3,0,7);ctx.fill()}}
  if(TH.snow)drawSnow(2,now);   // 가장 가까운 눈보라·불티 층: 기체보다 앞
  drawOrbitFore();
  if(flashT>0){ctx.fillStyle=`rgba(255,255,255,${flashT/.35})`;ctx.fillRect(0,0,W,H)}

  // ----- 오버레이 & HUD -----
  ctx.textAlign='center';
  if(state==='warning'&&stT%.5<.3){ctx.fillStyle='rgba(200,0,0,.35)';ctx.fillRect(0,H*.4375,W,H*.094)}
  if(state==='clear'){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,H*.369,W,H*.263)}
  if(state==='segclear'){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,H*.388,W,H*.219)}
  if(state==='over'){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,H*.35,W,H*.313)}
  ctx.textAlign='left';
  hiHUD(()=>{drawHeroLive(now);drawNeonHUD(now);drawOverlayText(now)});
  requestAnimationFrame(frame);
}

function drawOverlayText(now){
  if(state==='warning'&&stT%.5<.3)neon('WARNING',CX,H*.503,`700 16px ${NEO}`,'#ff4040','rgba(255,40,40,.9)','center');
  if(state==='clear'){const ct=isFinal?'FINAL VICTORY':'SECTOR '+stage+' CLEAR';
    neon(ct,CX,H*.475,`900 20px ${NEO}`,'#ffd84a','rgba(255,200,60,.9)','center');
    neon('SCORE '+score,CX,H*.544,`700 10px ${NEO}`,'#ffffff','rgba(255,255,255,.6)','center');
    if(stT%1<.6)neon(isFinal?'MISSION COMPLETE':'RETURNING TO BASE...',CX,H*.594,`600 9px ${NEO}`,'#ffffff','rgba(255,255,255,.5)','center')}
  if(state==='segclear'){neon(run.mode==='treasure'?'CHASE OVER':run.elite?'ELITE CLEAR':'AREA CLEAR',CX,H*.475,`900 18px ${NEO}`,'#9ad8ff','rgba(80,170,255,.9)','center');
    neon(`+${stageGold} G${run.bonus?`  (보너스 +${run.bonus})`:''}`,CX,H*.538,`700 10px ${NEO}`,'#ffd040','rgba(255,200,60,.7)','center');
    if(stT%1<.6)neon('항로 지도로 복귀...',CX,H*.581,`600 9px ${NEO}`,'#ffffff','rgba(255,255,255,.5)','center')}
  if(state==='over'){neon('GAME OVER',CX,H*.45,`900 22px ${NEO}`,'#ff5050','rgba(255,60,60,.9)','center');
    neon(`SECTOR ${stage} \u00b7 SCORE ${score}`,CX,H*.519,`700 10px ${NEO}`,'#ffffff','rgba(255,255,255,.6)','center');
    const nb=score>0&&score>=best;neon(nb?'\u2605 NEW BEST \u2605':'BEST '+best,CX,H*.569,`700 10px ${NEO}`,nb?'#ffd040':'#9ad0ff',nb?'rgba(255,200,60,.9)':'rgba(60,160,255,.7)','center');
    if(stT>1.5&&stT%1<.6)neon(IS_MOBILE?'TAP TO CONTINUE':'CLICK TO CONTINUE',CX,H*.631,`700 10px ${NEO}`,'#ffffff','rgba(255,255,255,.6)','center')}
}
if(!window.GALLERY)requestAnimationFrame(frame);
else window.GAME={ET,BOSSES,heroShip,drawEB,get ctx(){return ctx},set ctx(v){ctx=v},setFL:v=>{FL=v},mouseOff:()=>{mouse=null},set ship(v){Object.assign(ship,v)},get stage(){return stage},set stage(v){stage=v}};
</script></body></html>
