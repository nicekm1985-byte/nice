<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ladder Fortune</title>
<style>
:root{--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--txt:#e8ebff;--dim:#8d93b8;--acc:#7c9cff;--ok:#5ee6a8;--bad:#ff6b8a;--gold:#ffd166}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-touch-callout:none}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;height:100%;background:radial-gradient(120% 80% at 50% 0,#1b2150,#0b0d1a 62%);color:var(--txt);font:14px/1.45 -apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;gap:8px;padding:max(env(safe-area-inset-top),10px) 12px max(env(safe-area-inset-bottom),10px)}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#hud{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px}
#stage{font-weight:700;white-space:nowrap}#stage small{color:var(--dim);font-weight:500}
.bar{flex:1;height:16px;border-radius:9px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:9px;background:linear-gradient(90deg,#6c8bff,#ffd166);transition:width .4s}
.bar b{position:absolute;inset:0;text-align:center;font-size:11px;line-height:16px;text-shadow:0 1px 2px #0008}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{padding:2px 9px;border-radius:99px;background:rgba(255,255,255,.07);font-size:12px;white-space:nowrap;border:1px solid transparent}
.relic{font-size:17px;cursor:pointer;padding:0 2px}
#cvw{flex:1;min-height:0;position:relative}
#cv{position:absolute;inset:0;width:100%;height:100%;border-radius:16px;touch-action:none;cursor:pointer}
#zc{position:absolute;top:10px;right:8px;display:flex;gap:4px;z-index:2}
#zc button{border:1px solid var(--line);background:rgba(20,24,50,.82);color:var(--txt);border-radius:8px;padding:3px 9px;font:600 11px system-ui;cursor:pointer}
#zc button:hover:not(:disabled){background:rgba(60,70,130,.9)}
#zc button:disabled{opacity:.35;cursor:default}
#sp{position:absolute;top:10px;left:8px;display:flex;gap:4px;z-index:2}
#sp button{border:1px solid var(--line);background:rgba(20,24,50,.82);color:var(--txt);border-radius:8px;padding:3px 9px;font:700 11px system-ui;cursor:pointer}
#sp button:hover{background:rgba(60,70,130,.9)}
#sp button.on{background:linear-gradient(135deg,#6c8bff,#b07bff);border-color:transparent;color:#fff}
#turnBanner{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:3;display:none;align-items:center;gap:7px;padding:6px 14px;border-radius:99px;background:rgba(14,16,34,.88);border:1.5px solid var(--acc);box-shadow:0 0 18px 2px var(--acc);backdrop-filter:blur(8px);font-weight:800;font-size:13px;white-space:nowrap;animation:turnPulse 1.4s ease-in-out infinite}
#turnBanner .dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 8px currentColor}
@keyframes turnPulse{0%,100%{box-shadow:0 0 18px 2px var(--acc)}50%{box-shadow:0 0 28px 6px var(--acc)}}
#foot{padding:10px;display:flex;flex-direction:column;gap:8px}
#useBar:empty{display:none}
.ubtn{display:flex;align-items:center;gap:6px}
.ubtn.uinfo{opacity:.75;cursor:pointer}
.ubtn:disabled{opacity:.4}
.ubtn .ic{font-size:16px}
.ubtn small{opacity:.8;font-weight:600}
#hint{font-size:12px;color:var(--dim);text-align:center}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--txt);padding:9px 14px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover:not(:disabled){background:rgba(255,255,255,.16)}.btn:active:not(:disabled){transform:scale(.97)}.btn:disabled{opacity:.35;cursor:default}
.btn.dim{opacity:.45}
.btn.on{border:0;color:#10132a}
.btn.on.cut{background:linear-gradient(135deg,#ff6b8a,#ff9f7a);box-shadow:0 4px 16px #ff6b8a66}
.btn.on.add b{color:#10132a!important}
.btn.on.add{background:linear-gradient(135deg,#5ee6a8,#8ff0c8);box-shadow:0 4px 16px #5ee6a866}
.btn.pri{background:linear-gradient(135deg,#6c8bff,#b07bff);border:0;box-shadow:0 6px 20px #6c8bff55}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,8,20,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:10;padding:16px}
#roundEnd{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:9;cursor:pointer;background:rgba(6,8,20,.35)}
#roundEnd.on{display:flex;animation:reFade .25s ease both}
#roundEnd b{font-size:52px;font-weight:900;letter-spacing:6px;font-family:"Apple SD Gothic Neo","Noto Serif KR",serif;background:linear-gradient(135deg,#fff 10%,#ffd166 55%,#ff8fb0);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(255,209,102,.65));animation:rePulse 1.1s ease-in-out infinite}
#roundEnd small{display:block;margin-top:10px;text-align:center;font-size:13px;letter-spacing:2px;color:#c9d0ff;text-shadow:0 0 8px #000a;animation:reBlink 1.4s ease-in-out infinite}
#cpuUse{position:fixed;left:50%;top:38%;transform:translateX(-50%);z-index:12;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;max-width:88vw}
#cpuUse.on{opacity:1}
#cpuUse div{padding:12px 20px;border-radius:16px;background:rgba(14,16,34,.9);border:1.5px solid var(--acc);box-shadow:0 0 24px 4px rgba(124,156,255,.4);backdrop-filter:blur(8px)}
#cpuUse b{font-size:16px;font-weight:800;color:#fff;white-space:pre-line}
@keyframes reFade{0%{opacity:0}100%{opacity:1}}
@keyframes rePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes reBlink{0%,100%{opacity:.5}50%{opacity:1}}
.overlay.on{display:flex}
.card{width:100%;max-width:420px;padding:20px;display:flex;flex-direction:column;gap:12px;max-height:92dvh;overflow:auto;animation:pop .25s}
@keyframes pop{from{transform:translateY(12px) scale(.97);opacity:0}}
.card h2{margin:0;font-size:20px}.sub{margin:0;color:var(--dim)}
.opt{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%;margin-bottom:8px}
.opt:hover{background:rgba(255,255,255,.12)}
.opt .ic{font-size:28px}.opt small{display:block;color:var(--dim)}
.pro{color:var(--ok)}.con{color:var(--bad)}
.ver{position:absolute;top:10px;left:14px;font:600 11px/1 system-ui;letter-spacing:.5px;color:var(--dim);opacity:.85}
.logo{font-size:40px;font-weight:800;line-height:1.05;letter-spacing:4px;background:linear-gradient(135deg,#8fb0ff,#ffd166 60%,#ff8fb0);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}
#sw{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.dot{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:.15s}
.dot.sel{border-color:#fff;transform:scale(1.15);box-shadow:0 0 16px 2px currentColor}
input,textarea,select{font-size:16px!important}
input{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 10px;font:inherit;width:100%;min-width:0}
.tl{display:flex;flex-direction:column;gap:6px;min-height:120px}
.tr{display:flex;justify-content:space-between;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.06);animation:pop .2s;border-left:3px solid transparent}
.tr.out{background:rgba(255,107,138,.18)}
.tr b{font-variant-numeric:tabular-nums}
.big{font-size:44px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;color:var(--gold);text-shadow:0 0 24px #ffd16688}
.qline{text-align:center;color:var(--dim)}
#pick{position:fixed;z-index:5;pointer-events:none;text-align:center;opacity:0;transform:translate(-50%,-50%)}
#pick.on{animation:pk 2.6s ease both}
@keyframes pk{0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}14%{opacity:1;transform:translate(-50%,-50%) scale(1)}72%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-58%) scale(1.04)}}
#pick b{display:block;font-size:34px;font-weight:900;letter-spacing:4px;white-space:nowrap;font-family:"Apple SD Gothic Neo","Noto Serif KR",serif;background:linear-gradient(135deg,#fff 10%,#ffd166 55%,#ff8fb0);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,209,102,.55))}
#pick small{display:block;margin-top:6px;font-size:13px;letter-spacing:2px;color:#c9d0ff;text-shadow:0 0 8px #000a}
#mBtn{position:fixed;top:max(env(safe-area-inset-top),10px);right:12px;z-index:30;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(20,24,50,.85);color:var(--txt);font:800 15px system-ui;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#mBtn:hover{background:rgba(60,70,130,.9)}
#mPanel{position:fixed;top:calc(max(env(safe-area-inset-top),10px) + 44px);right:12px;z-index:30;width:230px;padding:12px;display:none;flex-direction:column;gap:10px;background:rgba(20,24,50,.95)}
#mPanel.on{display:flex}
#mVol{accent-color:#7c9cff}
#hud{padding-right:56px}
.xrow{background:rgba(197,139,255,.2)!important;border-left-color:#c58bff!important}
.xs{display:inline-block;font-size:30px;font-weight:900;line-height:1;color:#e9d5ff;text-shadow:0 0 12px #c58bff,0 0 26px #c58bff;animation:xslam .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes xslam{0%{transform:scale(3.2);opacity:0}45%{transform:scale(.85);opacity:1}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.shk{animation:shk .38s ease}
@keyframes shk{0%,100%{transform:translate(0,0)}15%{transform:translate(-6px,4px)}35%{transform:translate(5px,-5px)}55%{transform:translate(-4px,3px)}75%{transform:translate(3px,-2px)}}
.cmb{display:inline-block;margin-left:6px;padding:0 7px;border-radius:99px;background:linear-gradient(135deg,#ffd166,#ff8fb0);color:#10132a;font:800 10px/17px system-ui;animation:xslam .4s both}
.rec{text-align:center;font-size:22px;font-weight:900;color:#ffd166;text-shadow:0 0 14px #ffd16688;animation:xslam .5s both}
.rec small{display:block;font-size:12px;font-weight:600;color:var(--dim);text-shadow:none}
.say{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:10px 10px 10px 2px;background:rgba(255,255,255,.14);font-size:11px;font-weight:600;color:#fff;animation:xslam .35s both}
.badge2{display:inline-block;padding:0 8px;border-radius:99px;background:linear-gradient(135deg,#6c8bff,#b07bff);color:#fff;font:700 11px/18px system-ui;margin:0 3px 3px 0}
.card2{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.07);margin-bottom:6px}
.card2 b{color:#ffd166}
.gmb{display:flex;gap:6px;margin-top:6px}
.gmb .btn{flex:1;padding:7px 6px;font-size:12px}
.gmb .btn.sel{background:linear-gradient(135deg,#ff6b8a,#ff9f7a);color:#10132a;border:0}
.syn{display:inline-block;margin-top:3px;padding:0 8px;border-radius:99px;background:rgba(94,230,168,.18);color:#5ee6a8;font:700 11px/18px system-ui}
.hw-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:3px;color:var(--dim)}
.hw-top b{background:linear-gradient(135deg,#8fb0ff,#ffd166);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:14px}
.hw-slide{min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;animation:pop .25s}
.hw-ic{font-size:54px;line-height:1;filter:drop-shadow(0 0 14px rgba(255,209,102,.45))}
.hw-slide h3{margin:0;font-size:20px}
.hw-slide p{margin:0;color:#c9d0ff;line-height:1.6}
.hw-slide .hl{color:#ffd166;font-weight:700}
.hw-dots{display:flex;gap:6px;justify-content:center}
.hw-dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.2);transition:.2s}
.hw-dots i.on{background:#7c9cff;width:20px;border-radius:4px}
.tagline{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:-4px}
.tagline span{font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:13px;font-weight:900;letter-spacing:.5em;text-indent:.5em;white-space:nowrap;background:linear-gradient(90deg,#ffd166,#fff3c4 50%,#ff8fb0);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 8px rgba(255,209,102,.55))}
.tagline i{flex:1;max-width:44px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,209,102,.7))}
.tagline i:last-child{background:linear-gradient(270deg,transparent,rgba(255,143,176,.7))}
.mbox{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:14px;border:1px dashed rgba(255,209,102,.6);background:rgba(255,209,102,.07);cursor:pointer;color:inherit;font:inherit;text-align:left;margin-bottom:8px}
.mbox:hover:not(:disabled){background:rgba(255,209,102,.16)}.mbox:disabled{opacity:.5;cursor:default}
.mbox .ic{font-size:30px}.mbox small{display:block;color:var(--dim)}
.bx{font-size:64px;text-align:center;animation:bxs .5s ease-in-out infinite}
@keyframes bxs{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.08)}}
.bxo{animation:xslam .5s both}
.bet{display:flex;gap:6px;margin:6px 0}
.bet .opt{flex:1;flex-direction:column;text-align:center;gap:2px;margin:0;padding:10px 6px}
.bet .opt b{color:#ffd166}
#toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);padding:8px 14px;border-radius:12px;background:rgba(20,24,50,.92);border:1px solid var(--line);opacity:0;transition:.25s;pointer-events:none;z-index:20;font-size:13px;text-align:center;max-width:90vw}
#toast.on{opacity:1}
</style></head>
<body>

<script>
'use strict';
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d');
const P0=10,ROUNDS=5,MAXQ=4;
const STAGES=()=>Math.min(S.stages||9,P0-1);
const CELL={coin:{i:'🪙',c:'#ffd166',n:'코인'},jackpot:{i:'💰',c:'#ffb703',n:'대박'},bar:{i:'🧱',c:'#ffe27a',n:'금괴'},nuke:{i:'☢️',c:'#ff3b5c',n:'핵폭탄'},mult:{i:'✖️',c:'#c58bff',n:'배수'},bomb:{i:'💣',c:'#ff6b8a',n:'폭탄'},blank:{i:'💨',c:'#8d93b8',n:'꽝'},minus:{i:'➖',c:'#ff4d6d',n:'마이너스'},div:{i:'➗',c:'#ff8f6b',n:'나누기'}};
const CPU_NAMES=["민준","서연","도윤","하은","지호","수아","예준","지우","시우","서윤","주원","채원","하준","유나","건우","다은","우진","소율","현우","지안","선우","나윤","연우","은서","태오","아린","이안","세아","로운","하린","단우","서진","재민","유진","태윤","보라","진우","나래","승아","한결","가온","다솜","바다","별이","솔이","누리","하늘","마루","새봄","푸름"];
function cpuNames(n,exclude){const pool=CPU_NAMES.filter(x=>x!==exclude);for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}return pool.slice(0,n)}
const PAL=['#ffd166','#ff8fb0','#5ee6ff','#5ee6a8','#c58bff','#ff9f43','#6c8bff','#c8f56b','#ff6b6b','#b8c0d8'];

/* ---------- items ---------- */
const ITEMS=[
 {id:'clover',i:'🍀',n:'네잎클로버',pro:'꽝·폭탄 칸 출현 30% 감소',m:m=>{m.blankW*=.7;m.bombW*=.7}},
 {id:'scissors',i:'✂️',n:'황금 가위',pro:'자르기 포인트(✂) +1',m:m=>m.cuts+=1},

 {id:'bank',i:'🏦',n:'은행',pro:'정산 시 누적 점수의 8% 이자',m:m=>m.interest+=.08},
 {id:'shield',i:'🛡️',n:'수호 방패',pro:'폭탄 2회 무효화',on:S=>S.shield+=2},
 {id:'ticket',i:'🎟️',n:'VIP 티켓',pro:'내 스테이지 점수 +15%',con:'폭탄 피해 +30%',m:m=>{m.mine*=1.15;m.bomb*=1.3}},
 {id:'pouch',i:'💰',n:'황금 주머니',pro:'내 코인 획득 +40%',con:'폭탄 칸 출현 +50%',m:m=>{m.coin*=1.4;m.bombW*=1.5}},

function applyVol(){if(MG)MG.gain.value=muted?0:Math.pow(vol/100,1.5)}
function ensureAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.connect(AC.destination);applyVol()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}

function tone(f,t0,dur,vol,type='sine',f2){
 const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
 g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.006);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
 o.connect(g).connect(MG);o.start(t0);o.stop(t0+dur+.02)}

function waltzSting(){if(!AC)return;const t=AC.currentTime,mel=[784,988,1175],bass=[262,330,392];
 for(let i=0;i<3;i++){tone(mel[i],t+i*.13,.12,.05,'triangle');tone(bass[i],t+i*.13,.13,.035,'sine');tone(mel[i]*1.5,t+i*.13+.01,.09,.02,'sine')}}

  src.buffer=buf;src.connect(hp).connect(g).connect(MG);src.start(dt)}}

 if(pk.every(x=>x.t==='coin'||x.t==='jackpot'||x.t==='bar'))add('🔗 코인 연속',4);
 if(Object.values(cnt).some(c=>c>=3))add('🎯 트리플',4);
 if(Math.round(sub)%10===7)add('🍀 럭키 세븐',4);
 {const lastV=val(pk[ROUNDS-1]),prev=pk.slice(0,ROUNDS-1).reduce((a,x)=>a+val(x),0)/(ROUNDS-1);if(lastV>0&&lastV>prev)add('🔥 막판 역전',3)}

 if(best>0&&best*2>=sub)add('🏅 최고 단판',2);

function finalScore(pk,mine){

  for(let i=phase;i<W;i+=2)if(rnd()<d)rows[r][i]=true}

$('#mBtn').onclick=()=>{ensureAudio();$('#mPanel').classList.toggle('on')};
$('#mMute').onclick=()=>{ensureAudio();muted=!muted;localStorage.lfMute=muted?'1':'0';applyVol();syncMenu()};
$('#mVol').oninput=e=>{ensureAudio();vol=+e.target.value;if(vol>0&&muted){muted=false;localStorage.lfMute='0'}localStorage.lfVol=vol;applyVol();syncMenu()};
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#mPanel,#mBtn'))$('#mPanel').classList.remove('on')});
syncMenu();
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('dblclick',e=>{if(!e.target.closest('input,textarea'))e.preventDefault()},{passive:false});
addEventListener('resize',resize);
resize();renderTitle();requestAnimationFrame(frame);
</script>
</body></html>
